<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eleições View 2026 - Simulador Político & Locais de Votação</title>

<!-- Leaflet Mapa -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Proj4js (Reprojeção EPSG:5880 → WGS84) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<!-- Color Picker (Pickr) -->
<link href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

<!-- Export Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
    :root {
        --bg-color: #0b0f19;
        --sidebar-bg: rgba(15, 23, 42, 0.92);
        --sidebar-border: rgba(255, 255, 255, 0.08);
        --card-bg: rgba(30, 41, 59, 0.65);
        --card-border: rgba(255, 255, 255, 0.08);
        --card-hover: rgba(51, 65, 85, 0.8);
        --text-color: #f8fafc;
        --text-muted: #94a3b8;
        --accent-blue: #3b82f6;
        --accent-cyan: #06b6d4;
        --accent-green: #10b981;
        --input-bg: rgba(15, 23, 42, 0.7);
        --shadow-elevation: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 8px;
    }

    .light-theme {
        --bg-color: #f1f5f9;
        --sidebar-bg: rgba(255, 255, 255, 0.95);
        --sidebar-border: #cbd5e1;
        --card-bg: #ffffff;
        --card-border: #e2e8f0;
        --card-hover: #f8fafc;
        --text-color: #0f172a;
        --text-muted: #64748b;
        --accent-blue: #2563eb;
        --accent-cyan: #0284c7;
        --accent-green: #059669;
        --input-bg: #f8fafc;
        --shadow-elevation: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* APP LAYOUT GRID */
    #app {
        display: grid;
        grid-template-columns: 370px 1fr 340px;
        height: 100vh;
        width: 100vw;
        position: relative;
        overflow: hidden;
    }

    /* SIDEBARS COM FIXAÇÃO DE ALTURA PARA SCROLL */
    .sidebar, .sidebar-right {
        background: var(--sidebar-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-right: 1px solid var(--sidebar-border);
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-height: 100vh;
        overflow: hidden;
        z-index: 1000;
        box-shadow: var(--shadow-elevation);
        transition: all 0.3s ease;
    }
    .sidebar-right {
        border-right: none;
        border-left: 1px solid var(--sidebar-border);
    }

    /* HEADER STYLING */
    .header {
        padding: 16px 18px;
        border-bottom: 1px solid var(--sidebar-border);
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex-shrink: 0;
    }
    .brand-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .brand-title h1 {
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, var(--text-color) 30%, var(--accent-blue));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* IO BUTTONS BAR */
    .io-buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
    }
    .btn-io {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        color: var(--text-color);
        padding: 8px 4px;
        border-radius: var(--radius-sm);
        font-size: 0.7rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        transition: all 0.2s ease;
    }
    .btn-io:hover {
        background: var(--card-hover);
        border-color: var(--accent-blue);
        transform: translateY(-1px);
    }
    .btn-io i { font-size: 0.85rem; color: var(--accent-blue); }

    /* MODE TABS */
    .mode-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: var(--input-bg);
        border-radius: var(--radius-md);
        padding: 4px;
        border: 1px solid var(--card-border);
    }
    .mode-tab {
        padding: 8px;
        text-align: center;
        font-size: 0.78rem;
        font-weight: 700;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all 0.25s ease;
        color: var(--text-muted);
    }
    .mode-tab.active {
        background: var(--accent-blue);
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    /* AREA DE SCROLL PERFEITO DENTRO DA BARRA LATERAL */
    .controls-scroll {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    .controls-scroll::-webkit-scrollbar { width: 6px; }
    .controls-scroll::-webkit-scrollbar-track { background: transparent; }
    .controls-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }
    .controls-scroll::-webkit-scrollbar-thumb:hover { background: var(--accent-blue); }

    .control-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .control-group label {
        font-size: 0.68rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    select, input[type="text"] {
        width: 100%;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        color: var(--text-color);
        padding: 9px 12px;
        border-radius: var(--radius-md);
        font-size: 0.82rem;
        font-weight: 600;
        outline: none;
        transition: all 0.2s ease;
    }
    select:focus, input[type="text"]:focus {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* TOTAL POLL COUNTER */
    .poll-total-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-md);
        padding: 10px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .poll-total-val {
        font-size: 1.2rem;
        font-weight: 900;
        color: var(--accent-green);
    }
    .btn-normalize {
        background: rgba(16, 185, 129, 0.15);
        color: var(--accent-green);
        border: 1px solid rgba(16, 185, 129, 0.3);
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 0.68rem;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .btn-normalize:hover {
        background: var(--accent-green);
        color: #fff;
    }

    /* CANDIDATE SLIDER CARD COM FOTO DO CANDIDATO E LOGO DO PARTIDO */
    .slider-box {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition: all 0.2s ease;
    }
    .slider-box:hover {
        border-color: rgba(255, 255, 255, 0.2);
        background: var(--card-hover);
    }
    .slider-box.inactive {
        opacity: 0.45;
        filter: grayscale(80%);
    }

    .slider-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .cand-info-group {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .cand-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--cand-color, #3b82f6);
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        background: #1e293b;
        flex-shrink: 0;
    }
    .party-badge-img {
        height: 18px;
        width: auto;
        max-width: 36px;
        object-fit: contain;
        border-radius: 3px;
    }
    .cand-name-party {
        display: flex;
        flex-direction: column;
    }
    .cand-name-text {
        font-size: 0.85rem;
        font-weight: 700;
        line-height: 1.1;
    }
    .cand-party-tag {
        font-size: 0.65rem;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 2px;
    }

    .pct-input-field {
        width: 65px;
        background: var(--input-bg);
        border: 1px solid var(--card-border);
        color: var(--text-color);
        border-radius: var(--radius-sm);
        padding: 4px 6px;
        font-size: 0.82rem;
        font-weight: 800;
        text-align: right;
    }

    /* CUSTOM RANGE SLIDER */
    input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 5px;
        background: rgba(148, 163, 184, 0.2);
        border-radius: 10px;
        outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--text-color);
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        border: 2px solid var(--accent-blue);
        transition: transform 0.1s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    /* BUTTONS PRIMARY & SECONDARY */
    .btn-primary {
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: #ffffff;
        border: none;
        padding: 12px;
        border-radius: var(--radius-md);
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        margin-top: 4px;
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }
    .btn-secondary {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        color: var(--text-color);
        padding: 10px 12px;
        border-radius: var(--radius-md);
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.2s ease;
    }
    .btn-secondary:hover {
        background: var(--card-hover);
        border-color: var(--accent-blue);
    }

    /* MAP CONTAINER */
    #map {
        width: 100%;
        height: 100vh;
        background: var(--bg-color);
        z-index: 1;
    }

    /* MAP CONTROLS OVERLAY */
    .map-controls {
        position: absolute;
        top: 20px;
        right: 355px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .map-btn {
        width: 38px;
        height: 38px;
        background: var(--sidebar-bg);
        backdrop-filter: blur(10px);
        border: 1px solid var(--sidebar-border);
        color: var(--text-color);
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 0.95rem;
        box-shadow: var(--shadow-elevation);
        transition: all 0.2s ease;
    }
    .map-btn:hover {
        background: var(--accent-blue);
        color: #ffffff;
        transform: scale(1.05);
    }

    /* LEGEND OVERLAY */
    .legend {
        position: absolute;
        bottom: 24px;
        right: 355px;
        z-index: 1000;
        background: var(--sidebar-bg);
        backdrop-filter: blur(16px);
        border: 1px solid var(--sidebar-border);
        padding: 10px 14px;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-elevation);
        width: 240px;
    }
    .legend-grid {
        display: flex;
        height: 10px;
        border-radius: 5px;
        overflow: hidden;
        margin-top: 6px;
    }
    .legend-item { flex: 1; height: 100%; }

    /* SIDEBAR RIGHT (RESULTS) */
    .cand-row {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: all 0.2s ease;
    }
    .cand-row:hover { background: var(--card-hover); }
    .cand-row.disabled { opacity: 0.4; }
    .cand-check {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 2px solid var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .cand-check.checked {
        background: var(--accent-blue);
        border-color: var(--accent-blue);
    }
    .cand-check.checked::after {
        content: '✓';
        color: #fff;
        font-size: 10px;
        font-weight: 900;
    }
    .cand-color-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        cursor: pointer;
        flex-shrink: 0;
        box-shadow: 0 0 0 2px rgba(255,255,255,0.2);
    }
    .cand-info { flex: 1; }
    .cand-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
        font-size: 0.82rem;
        font-weight: 700;
    }
    .progress-bar {
        height: 6px;
        background: rgba(148, 163, 184, 0.2);
        border-radius: 10px;
        overflow: hidden;
    }
    .progress-fill {
        height: 100%;
        border-radius: 10px;
        transition: width 0.4s ease;
    }

    .btn-back {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
        padding: 8px 12px;
        border-radius: var(--radius-md);
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
        display: none;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
        width: 100%;
    }
    .btn-back:hover { background: #ef4444; color: #fff; }

    /* TOOLTIP MAPA */
    .custom-tooltip {
        background: var(--sidebar-bg);
        backdrop-filter: blur(12px);
        border: 1px solid var(--sidebar-border);
        color: var(--text-color);
        padding: 10px 14px;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-elevation);
    }
    .tt-head {
        font-size: 0.82rem;
        font-weight: 800;
        border-bottom: 1px solid var(--card-border);
        padding-bottom: 4px;
        margin-bottom: 6px;
    }
    .tt-body {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.82rem;
    }

    /* SWITCH CONTROL */
    .switch-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 4px 0;
    }
    .switch-label { font-size: 0.7rem; font-weight: 800; color: var(--text-muted); }
    .switch {
        position: relative;
        display: inline-block;
        width: 42px;
        height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle {
        position: absolute; cursor: pointer; inset: 0;
        background-color: var(--input-bg);
        border: 1px solid var(--card-border);
        transition: .3s;
        border-radius: 20px;
    }
    .slider-toggle:before {
        position: absolute; content: "";
        height: 14px; width: 14px; left: 3px; bottom: 3px;
        background-color: var(--text-color);
        transition: .3s;
        border-radius: 50%;
    }
    input:checked + .slider-toggle { background-color: var(--accent-blue); }
    input:checked + .slider-toggle:before { transform: translateX(20px); }

    /* MODAL */
    .modal-overlay {
        position: fixed; inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        z-index: 99999;
        display: none;
        align-items: center;
        justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
        background: var(--sidebar-bg);
        border: 1px solid var(--sidebar-border);
        width: 90%;
        max-width: 580px;
        max-height: 85vh;
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        overflow: hidden;
    }
    .modal-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--sidebar-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 800;
        font-size: 1.05rem;
    }
    .modal-body {
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .modal-footer {
        padding: 12px 20px;
        border-top: 1px solid var(--sidebar-border);
        display: flex;
        justify-content: flex-end;
    }

    /* LOADER */
    #loader {
        position: fixed; inset: 0;
        background: rgba(11, 15, 25, 0.88);
        backdrop-filter: blur(10px);
        z-index: 1000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
    }
    #loader.hidden { display: none; }
    .spinner {
        width: 48px; height: 48px;
        border: 4px solid rgba(255,255,255,0.1);
        border-left-color: var(--accent-blue);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* MOBILE NAVIGATION */
    .mobile-nav {
        display: none;
        position: fixed; bottom: 0; left: 0; right: 0;
        height: 60px;
        background: var(--sidebar-bg);
        backdrop-filter: blur(20px);
        border-top: 1px solid var(--sidebar-border);
        z-index: 10000;
        grid-template-columns: repeat(3, 1fr);
    }
    .nav-item {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 4px; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); cursor: pointer;
    }
    .nav-item.active { color: var(--accent-blue); }

    @media (max-width: 900px) {
        #app { grid-template-columns: 1fr; }
        .sidebar, .sidebar-right {
            position: absolute; inset: 0; bottom: 60px;
            display: none;
        }
        .sidebar.active, .sidebar-right.active { display: flex; }
        .map-controls, .legend { right: 16px; }
        .mobile-nav { display: grid; }
    }
</style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <h3 id="loaderMsg" style="font-weight: 700;">Carregando Simulador Político...</h3>
</div>

<!-- MODAL DE CONFIGURAÇÃO -->
<div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <span id="modalTitle">Configuração</span>
            <span style="cursor:pointer;" onclick="app.closeModal()"><i class="fas fa-times"></i></span>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
            <button class="btn-primary" style="width: auto; padding: 8px 24px;" onclick="app.closeModal()">Confirmar</button>
        </div>
    </div>
</div>

<div id="app">
    <!-- BARRA LATERAL ESQUERDA (PAINEL DE CONFIGURAÇÃO) -->
    <aside class="sidebar" id="sidebarConfig">
        <div class="header">
            <div class="brand-title">
                <h1>Eleições 2026</h1>
            </div>
            
            <div class="io-buttons">
                <button class="btn-io" onclick="app.resetToClean()"><i class="fas fa-undo"></i> Resetar</button>
                <button class="btn-io" onclick="app.exportConfig()"><i class="fas fa-download"></i> Salvar</button>
                <button class="btn-io" onclick="document.getElementById('fileInput').click()"><i class="fas fa-upload"></i> Abrir</button>
                <button class="btn-io" id="themeToggleBtn" onclick="app.toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i> <span id="themeText">Escuro</span></button>
                <input type="file" id="fileInput" style="display:none" onchange="app.importConfig(this)" accept=".json">
            </div>

            <div class="mode-tabs">
                <div class="mode-tab active" id="tab1" onclick="app.setTurn(1)">1º TURNO</div>
                <div class="mode-tab" id="tab2" onclick="app.setTurn(2)">2º TURNO</div>
            </div>
        </div>

        <div class="controls-scroll">
            <div class="control-group">
                <label><i class="fas fa-map-marked-alt"></i> VISUALIZAÇÃO CARTOGRÁFICA</label>
                <select id="viewModeSelect" onchange="app.handleViewChange()">
                    <option value="states">Por Estados (Brasil)</option>

    data: { base22: null, round1: null, round2: null, geoJson: null, names: {}, brazilGeoJson: null, zonasGeoJson: null, lvCache: {} },
    state: {
        turn: 1, view: 'states', selectedId: null, selectedName: "Brasil", selectedScope: null, activeCityId: null,
        level: 'national', previousLayer: null, munCodeLV: null, currentLVProps: null,
        ignored: new Set(), customColors: JSON.parse(localStorage.getItem('v26_colors') || '{}'),
        t1_polls: {}, t1_matrix: {}, t1_matrix_state: {}, t1_mults: {}, t2_finalists: [], t2_polls: {}, t2_migr: {}, t2_mults: {}, active_candidates: {}, t2_mode: 'organic'
    },

    init: async () => {
        app.initTheme();
        
        // CONFIGURAÇÃO DO LEAFLET COM CANVAS E RENDERIZADOR VETORIAL LISO
        app.map = L.map('map', { 
            center: [-15, -50], 
            zoom: 4, 
            zoomControl: false, 
            preferCanvas: true,
            renderer: L.canvas({ tolerance: 0, padding: 0.5 })
        });
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { opacity: 0.4 }).addTo(app.map);
        
        app.loadScenario(DEFAULT_SCENARIO);
        app.renderLegend();
        app.renderUI();
        await app.loadData();
    },

    handleImgFallback: (img, candId) => {
        if (!img.dataset.triedRemote) {
            img.dataset.triedRemote = 'true';
            img.src = REMOTE_PHOTOS[candId] || app.getAvatarSvg(candId);
        } else {
            img.src = app.getAvatarSvg(candId);
        }
    },

    getPartyLogoHtml: (party) => {
        const logoUrl = PARTY_LOGOS[party];
        if (logoUrl) {
            return `<img src="${logoUrl}" class="party-badge-img" onerror="this.outerHTML='<span class=\\'cand-party-tag\\'>${party}</span>'">`;
        }
        return `<span class="cand-party-tag">${party}</span>`;
    },

    getAvatarSvg: (id) => {
        const cand = CONFIG.candidates.find(c => c.id === id);
        const color = cand ? cand.color : '#3b82f6';
        const name = cand ? cand.name : id;
        const initials = name.substring(0, 2).toUpperCase();
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${color}"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="42">${initials}</text></svg>`);
    },

    getCandColor: (partyOrId) => {
        const cand = CONFIG.candidates.find(c => c.id === partyOrId || c.party === partyOrId);
        if (cand && app.state.customColors[cand.id]) return app.state.customColors[cand.id];
        return cand ? cand.color : '#555555';
    },

    initTheme: () => {
        const savedTheme = localStorage.getItem('eleicoes-view-theme') || 'dark';
        if (savedTheme === 'light') document.body.classList.add('light-theme');
        app.updateThemeUI(savedTheme);
    },
    toggleTheme: () => {
        const isLight = document.body.classList.contains('light-theme');
        const next = isLight ? 'dark' : 'light';
        document.body.classList.toggle('light-theme', !isLight);
        localStorage.setItem('eleicoes-view-theme', next);
        app.updateThemeUI(next);
    },
    updateThemeUI: (theme) => {
        const icon = document.getElementById('themeIcon'), text = document.getElementById('themeText');
        if (icon && text) {
            icon.className = theme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
            text.innerText = theme === 'light' ? 'Claro' : 'Escuro';
        }
    },

    mobileNav: (tab) => {
        const left = document.getElementById('sidebarConfig'), right = document.getElementById('sidebarResults'), items = document.querySelectorAll('.nav-item');
        items.forEach(i => i.classList.remove('active'));
        document.getElementById('nav' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
        if(tab === 'map') { left.classList.remove('active'); right.classList.remove('active'); } 
        else if(tab === 'config') { left.classList.add('active'); right.classList.remove('active'); } 
        else if(tab === 'results') { right.classList.add('active'); left.classList.remove('active'); }
    },

    resetToClean: () => {
        if(confirm("Deseja resetar todas as configurações para o padrão do modelo 2026?")) {
            app.loadScenario(DEFAULT_SCENARIO);
            app.renderUI();
            app.runSimulation();
        }
    },
    loadScenario: (config) => {
        ['t1_polls','t1_matrix','t1_matrix_state','t1_mults','t2_migr','t2_mults','active_candidates'].forEach(k => {
            if(config[k]) app.state[k] = JSON.parse(JSON.stringify(config[k]));
        });
        if(config.t2_mode) {
            app.state.t2_mode = config.t2_mode;
            if(document.getElementById('t2ModeSwitch')) document.getElementById('t2ModeSwitch').checked = (config.t2_mode === 'organic');
        }
    },

    loadData: async () => {
        const loader = document.getElementById('loader');
        try { 
            const res = await fetch('data/2022_president.json'); const json = await res.json(); 
            app.data.base22 = json['1']; app.data.names = json['1'].meta_nomes || {}; 
            try { 
                const zRes = await fetch('data/mapazn.geojson'); 
                if (zRes.ok) { 
                    app.data.zonasGeoJson = await zRes.json(); 
                    app.processZonasGeoJson(); 
                } 
            } catch(ez) {}
            await app.loadBrazilLayer(); app.runSimulation(); 
        } catch(e) { console.error(e); } finally { loader.classList.add('hidden'); }
    },

    exportConfig: () => {
        const config = { t1_polls: app.state.t1_polls, t1_matrix: app.state.t1_matrix, t1_matrix_state: app.state.t1_matrix_state, t1_mults: app.state.t1_mults, t2_migr: app.state.t2_migr, t2_mults: app.state.t2_mults, active_candidates: app.state.active_candidates, t2_mode: app.state.t2_mode };
        saveAs(new Blob([JSON.stringify(config, null, 2)], {type: "application/json;charset=utf-8"}), "eleicoes_2026_config.json");
    },
    importConfig: (input) => {
        const file = input.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                app.loadScenario(JSON.parse(e.target.result));
                app.renderUI();
                app.runSimulation();
                alert("Configuração importada com sucesso!");
            } catch(err) { alert("Erro ao importar arquivo JSON: " + err.message); }
        };
        reader.readAsText(file); input.value = '';
    },
    
    processZonasGeoJson: () => {
        app.data.base22.zonas = {};
        app.data.zonasGeoJson.features.forEach(f => {
            const p = f.properties; const id = String(p.CD_MUN_I) + '_' + String(p.ZE_NUM);
            app.data.base22.zonas[id] = { LULA: p.PS22_113 || 0, JAIR: p.PS22_122 || 0, CIRO: p.PS22_112 || 0, SIMONE: p.PS22_115 || 0 };
        });
    },

    setTurn: (t) => {
        app.state.turn = t;
        document.getElementById('tab1').className = `mode-tab ${t===1?'active':''}`;
        document.getElementById('tab2').className = `mode-tab ${t===2?'active':''}`;
        document.getElementById('controlsT1').style.display = t===1?'flex':'none';
        document.getElementById('controlsT2').style.display = t===2?'flex':'none';
        
        if(t === 2 && app.state.t2_finalists.length === 0 && app.data.round1) {
            const sorted = Object.entries(app.data.round1.nacional).sort((a,b)=>b[1]-a[1]);
            if(sorted.length >= 2) { app.state.t2_finalists = [sorted[0][0], sorted[1][0]]; app.updateT2UI(); }
        }
        app.runSimulation();
    },

    toggleT2Mode: (isOrganic) => {
        app.state.t2_mode = isOrganic ? 'organic' : 'manual';
        document.getElementById('lblT2Votes').innerText = isOrganic ? "Resultado Projetado (Orgânico)" : "Resultado Alvo (Manual)";
        app.updateT2UI(); app.runSimulation();
    },

    handleViewChange: async () => {
        app.state.view = document.getElementById('viewModeSelect').value;
        if(app.state.view === 'all_cities') await app.loadAllMunicipalities();
        else app.resetSelection();
    },
    
    getFeatureId: (feature, scope) => {
        const p = feature.properties;
        if (scope === 'locais') return p.ID_UNICO || p.local_id || p.CD_MUN_I;
        if (scope === 'zonas') return String(p.CD_MUN_I) + '_' + String(p.ZE_NUM);
        if (scope === 'municipios') return String(p.CD_MUN || p.id || p.geocodigo || p.CD_MUN_I || p.codarea || '');
        return String(p.CD_UF || (STATES.find(x => x.sigla === p.sigla)||{}).id || p.id || '');
    },

    loadBrazilLayer: async () => {
        if(app.layers.brazil) {
            if(!app.map.hasLayer(app.layers.brazil)) app.layers.brazil.addTo(app.map);
            app.layers.brazil.setStyle((f) => app.getStyle(f, 'estados')); return;
        }
        const res = await fetch('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/brazil-states.geojson');
        app.data.brazilGeoJson = await res.json();
        const ufMap = {'AC':'12','AL':'27','AM':'13','AP':'16','BA':'29','CE':'23','DF':'53','ES':'32','GO':'52','MA':'21','MG':'31','MS':'50','MT':'51','PA':'15','PB':'25','PE':'26','PI':'22','PR':'41','RJ':'33','RN':'24','RO':'11','RR':'14','RS':'43','SC':'42','SE':'28','SP':'35','TO':'17'};
        app.data.brazilGeoJson.features.forEach(f => f.properties.id = ufMap[f.properties.sigla]);

        app.layers.brazil = L.geoJSON(app.data.brazilGeoJson, {
            style: (f) => app.getStyle(f, 'estados'),
            smoothFactor: 0,
            onEachFeature: (f, l) => {
                l.on('click', () => {
                    if(app.state.view === 'states') app.loadStateCities(app.getFeatureId(f,'estados'), f.properties.NM_UF || f.properties.name);
                });
                app.bindTooltip(l, 'estados');
            }
        }).addTo(app.map);
    },
    
    fetchGeoJsonCache: async () => {
        if (app.data.geoJson) return app.data.geoJson;
        const res = await fetch("https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-100-mun.json");
        app.data.geoJson = await res.json();
        return app.data.geoJson;
    },

    loadAllMunicipalities: async () => {
        const loader = document.getElementById('loader'); loader.classList.remove('hidden');
        if(app.layers.brazil && app.map.hasLayer(app.layers.brazil)) app.map.removeLayer(app.layers.brazil);
        if(app.layers.lv) { app.map.removeLayer(app.layers.lv); app.layers.lv = null; }
        if(app.layers.cities) app.map.removeLayer(app.layers.cities); app.layers.cities = null;

        const data = await app.fetchGeoJsonCache();
        app.layers.cities = L.geoJSON(data, {
            style: (f) => app.getStyle(f, 'municipios'),
            smoothFactor: 0,
            onEachFeature: (f, l) => {
                l.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    const cityId = app.getFeatureId(f, 'municipios');
                    const cityName = f.properties.NM_MUN||f.properties.name;
                    app.selectRegion(cityId, cityName, 'municipios');
                });
                app.bindTooltip(l, 'municipios');
            }
        }).addTo(app.map);
        if (app.layers.cities.getBounds().isValid()) app.map.fitBounds(app.layers.cities.getBounds());
        app.state.level = 'municipality'; loader.classList.add('hidden');
    },
    
    loadStateCities: async (ufId, ufName) => {
        if(app.state.view === 'all_cities') return;
        const loader = document.getElementById('loader'); loader.classList.remove('hidden');
        document.getElementById('loaderMsg').innerText = `Carregando ${ufName}...`;
        if(app.layers.lv) { app.map.removeLayer(app.layers.lv); app.layers.lv = null; }
        if(app.layers.cities) { app.map.removeLayer(app.layers.cities); app.layers.cities = null; }
        if(app.layers.brazil) app.map.removeLayer(app.layers.brazil);

        const fullData = await app.fetchGeoJsonCache();
        const feats = fullData.features.filter(f => app.getFeatureId(f, 'municipios').startsWith(ufId));
        app.layers.cities = L.geoJSON({ type:"FeatureCollection", features:feats }, {
            style: (f) => app.getStyle(f, 'municipios'),
            smoothFactor: 0,
            onEachFeature: (f, l) => {
                l.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    const cityId = app.getFeatureId(f, 'municipios');
                    const cityName = f.properties.NM_MUN||f.properties.name;
                    app.selectRegion(cityId, cityName, 'municipios');
                });
                app.bindTooltip(l, 'municipios');
            }
        }).addTo(app.map);
        if (app.layers.cities.getBounds().isValid()) app.map.fitBounds(app.layers.cities.getBounds());
        app.selectRegion(ufId, ufName, 'estados'); loader.classList.add('hidden');
    },
    
    // --- LOCAIS DE VOTAÇÃO (LV 2022) COM REPROJEÇÃO PROJ4 (EPSG:5880 -> EPSG:4326) ---
    loadLVForMunicipality: async (munCode, munName) => {
        const loader = document.getElementById('loader');
        loader.querySelector('h3').textContent = `Carregando Locais de Votação (${munName})...`;
        loader.classList.remove('hidden');

        try {
            if (!app.data.lvCache[munCode]) {
                const resp = await fetch(`estados_mun/${munCode}.geojson`);
                if (!resp.ok) throw new Error("Arquivo LV não encontrado para " + munCode);
                const raw = await resp.json(); delete raw.crs;
                app.data.lvCache[munCode] = raw;
            }

            const reprojected = app.reprojectGeoJSON(app.data.lvCache[munCode]);
            const features = reprojected.features;
            if (!features || features.length === 0) throw new Error("Nenhum local de votação encontrado.");

            if (app.layers.cities) { app.state.previousLayer = app.layers.cities; app.map.removeLayer(app.layers.cities); app.layers.cities = null; }
            else if (app.layers.brazil) { app.state.previousLayer = app.layers.brazil; app.map.removeLayer(app.layers.brazil); app.layers.brazil = null; }

            const lvLayer = L.geoJSON({ type: "FeatureCollection", features }, {
                smoothFactor: 0,
                style: f => app.getStyle(f, 'locais'),
                onEachFeature: (f, layer) => {
                    const lvId = f.properties.ID_UNICO || f.properties.local_id || f.properties.CD_MUN_I;
                    const lvName = f.properties.nm_locvot || f.properties.local_id || "Local de Votação";
                    layer.on('click', (e) => {
                        L.DomEvent.stopPropagation(e);
                        app.selectRegion(lvId, lvName, 'locais', f.properties);
                    });
                    app.bindTooltip(layer, 'locais', f.properties);
                }
            }).addTo(app.map);

            app.layers.lv = lvLayer;
            app.state.level = 'lv';
            app.state.munCodeLV = munCode;
            document.getElementById('btnBack').style.display = 'flex';

            setTimeout(() => {
                app.map.invalidateSize();
                const bounds = lvLayer.getBounds();
                if (bounds.isValid()) app.map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
            }, 100);

        } catch(e) {
            console.warn(e.message);
        } finally {
            loader.classList.add('hidden');
            app.updateSidebarRight();
        }
    },

    reprojectGeoJSON: (geojson) => {
        const transformCoords = (coords) => {
            if (typeof coords[0] === 'number') {
                if (Math.abs(coords[1]) <= 90 && Math.abs(coords[0]) <= 180) return coords;
                const [lng, lat] = proj4("EPSG:5880", "EPSG:4326", coords);
                return [lng, lat];
            }
            return coords.map(transformCoords);
        };
        const features = geojson.features.map(f => ({
            ...f,
            geometry: { type: f.geometry.type, coordinates: transformCoords(f.geometry.coordinates) }
        }));
        return { type: "FeatureCollection", features };
    },

    parseLVVotes: (props) => {
        const turn = app.state.turn;
        const suffix = ` ${turn}T`;
        const votes = {};
        Object.entries(props).forEach(([key, val]) => {
            if (typeof val !== 'number' || !key.endsWith(suffix)) return;
            const clean = key.slice(0, -suffix.length).trim();
            const m = clean.match(/^(.+?)\s*\((.+?)\)/);
            if (!m) return;
            const name = m[1].toUpperCase(), party = m[2];
            
            // Mapear candidatos de 2022 para chaves de matriz
            let cand22Key = 'SIMONE';
            if (name.includes('LULA')) cand22Key = 'LULA';
            else if (name.includes('BOLSONARO') || name.includes('JAIR')) cand22Key = 'JAIR';
            else if (name.includes('CIRO')) cand22Key = 'CIRO';
            else if (name.includes('TEBET') || name.includes('SIMONE')) cand22Key = 'SIMONE';
            else if (name.includes('SORAYA')) cand22Key = 'SORAYA';
            else if (name.includes('DAVILA') || name.includes('FELLIPE')) cand22Key = 'FELLIPE';
            else if (name.includes('KELMON') || name.includes('PADRE')) cand22Key = 'KELMON';
            
            votes[cand22Key] = (votes[cand22Key] || 0) + val;
        });
        return votes;
    },

    // SIMULAÇÃO EM TEMPO REAL PARA UM POLÍGONO DE LOCAL DE VOTAÇÃO
    calculateLV2026: (props) => {
        const votes22 = app.parseLVVotes(props);
        const ufId = app.state.munCodeLV ? app.state.munCodeLV.substring(0,2) : "35";
        const activeIds = CONFIG.candidates.filter(c => app.state.active_candidates[c.id] !== false).map(c => c.id);
        const simVotes = {};

        if (app.state.turn === 1) {
            activeIds.forEach(candId => {
                let sum = 0;
                SOURCES_2022.forEach(src => {
                    const rawVal = app.getMatrixValue(ufId, src.id, candId);
                    let totalActiveWeight = 0; activeIds.forEach(cid => { totalActiveWeight += app.getMatrixValue(ufId, src.id, cid); });
                    let finalFactor = totalActiveWeight > 0 ? rawVal / totalActiveWeight : 0;
                    sum += (votes22[src.id] || 0) * finalFactor;
                });
                if(app.state.t1_mults[ufId] && app.state.t1_mults[ufId][candId]) sum *= app.state.t1_mults[ufId][candId];
                simVotes[candId] = Math.round(sum);
            });
        } else {
            const [id1, id2] = app.state.t2_finalists;
            if (id1 && id2) {
                let vA = 0, vB = 0;
                Object.entries(votes22).forEach(([cid, v]) => {
                    if (cid === id1) vA += v;
                    else if (cid === id2) vB += v;
                    else {
                        let ratio = app.state.t2_migr[cid] !== undefined ? app.state.t2_migr[cid] : 0.5;
                        vA += v * (1 - ratio); vB += v * ratio;
                    }
                });
                simVotes[id1] = Math.round(vA); simVotes[id2] = Math.round(vB);
            }
        }
        return simVotes;
    },

    goBack: () => {
        if (app.state.level === 'lv') {
            if (app.layers.lv) app.map.removeLayer(app.layers.lv);
            if (app.state.previousLayer) {
                if (app.state.previousLayer === app.layers.brazil) app.layers.brazil.addTo(app.map);
                else if (app.state.previousLayer === app.layers.cities) app.layers.cities.addTo(app.map);
                app.state.previousLayer = null;
            }
            app.layers.lv = null;
            app.state.level = 'municipality';
            app.state.selectedId = app.state.munCodeLV;
            app.state.selectedName = "Município";
            app.refreshUI();
            return;
        }
        app.resetSelection();
    },

    resetSelection: () => {
        app.state.selectedId = null; app.state.selectedName = "Brasil"; app.state.selectedScope = null; app.state.activeCityId = null; app.state.currentLVProps = null;
        document.getElementById('btnBack').style.display = 'none';
        if (app.layers.lv) { app.map.removeLayer(app.layers.lv); app.layers.lv = null; }
        if (app.layers.cities) { app.map.removeLayer(app.layers.cities); app.layers.cities = null; }
        if (app.layers.brazil) {
            if (!app.map.hasLayer(app.layers.brazil)) app.layers.brazil.addTo(app.map);
            app.layers.brazil.setStyle((f) => app.getStyle(f, 'estados'));
        } else app.loadBrazilLayer();
        app.map.setView([-15, -50], 4);
        document.getElementById('viewModeSelect').value = 'states'; app.state.view = 'states'; app.state.level = 'national';
        if(window.innerWidth <= 768) app.mobileNav('config');
        app.updateSidebarRight();
    },
    
    getStyle: (feature, scope) => {
        const id = app.getFeatureId(feature, scope);
        return { 
            fillColor: app.getColorForId(id, scope, feature.properties).fill, 
            weight: scope === 'estados' ? 1.2 : (scope === 'locais' ? 0.5 : 0.35), 
            color: '#ffffff', 
            opacity: 0.9, 
            fillOpacity: 0.95 
        };
    },
    getColorForId: (id, scope, props) => {
        let votes = {};
        if (scope === 'locais' && props) {
            votes = app.calculateLV2026(props);
        } else {
            const dataset = app.state.turn === 1 ? app.data.round1 : app.data.round2; if(!dataset) return { fill: '#333' };
            if (scope === 'zonas') votes = dataset.zonas ? dataset.zonas[id] : null;
            else if (id.length === 2 && scope === 'estados') votes = dataset.estados[id];
            else votes = dataset.municipios[id];
        }
        if(!votes) return { fill: '#333' };

        let max = -1, winner = null, total = 0;
        for(let c in votes) {
            if (!app.state.ignored.has(c)) {
                total += votes[c]; if(votes[c] > max) { max = votes[c]; winner = c; }
            }
        }
        const cand = CONFIG.candidates.find(c => c.id === winner);
        const candColor = cand ? app.getCandColor(cand.id) : '#555';
        return { fill: app.getDiscreteColor(candColor, total > 0 ? (max/total)*100 : 0) };
    },
    
    generateStaticMap: async (format) => {
        const loader = document.getElementById('loader'); loader.classList.remove('hidden');
        setTimeout(() => {
            try {
                let features = []; let scope = 'municipios';
                if (app.state.level === 'lv' && app.layers.lv) {
                    features = app.layers.lv.toGeoJSON().features; scope = 'locais';
                } else if (app.state.view === 'states' && !app.state.selectedId) {
                    features = app.data.brazilGeoJson.features; scope = 'estados';
                } else if (app.state.selectedId && app.state.selectedId.length === 2) {
                    features = app.data.geoJson.features.filter(f => app.getFeatureId(f, 'municipios').startsWith(app.state.selectedId)); scope = 'municipios';
                } else {
                    features = app.data.brazilGeoJson.features; scope = 'estados';
                }
                if (features.length === 0) throw new Error("Nenhum dado encontrado.");

                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                features.forEach(f => { const scan = (coords) => { coords.forEach(pt => { if(typeof pt[0]==='number'){ if(pt[0]<minX)minX=pt[0]; if(pt[0]>maxX)maxX=pt[0]; if(pt[1]<minY)minY=pt[1]; if(pt[1]>maxY)maxY=pt[1]; } else scan(pt); }); }; if(f.geometry && f.geometry.type.includes('Polygon')) scan(f.geometry.coordinates); });
                const w = 3840, latD = maxY - minY, lonD = maxX - minX, h = w / (lonD/latD); const proj = (x,y) =>[(x-minX)*(w/lonD), (maxY-y)*(h/latD)];
                let svg = '';
                features.forEach(f => {
                    const id = app.getFeatureId(f, scope);
                    const col = app.getColorForId(id, scope, f.properties).fill;
                    let d = ''; const draw = (r) => { let p=''; r.forEach((pt,i)=>{ const[px,py]=proj(pt[0],pt[1]); p+=(i===0?'M':'L')+px.toFixed(1)+','+py.toFixed(1); }); return p+'Z '; };
                    if(f.geometry.type==='Polygon') f.geometry.coordinates.forEach(r=>d+=draw(r));
                    else if(f.geometry.type==='MultiPolygon') f.geometry.coordinates.forEach(p=>p.forEach(r=>d+=draw(r)));
                    svg+=`<path d="${d}" fill="${col}" stroke="#fff" stroke-width="${scope==='estados'? 2 : 0.5}"/>`;
                });
                const finalSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}">${svg}</svg>`;
                const fname = `mapa_eleicoes_${app.state.selectedName}`;
                if(format==='svg') saveAs(new Blob([finalSvg],{type:"image/svg+xml;charset=utf-8"}), `${fname}.svg`);
                else {
                    const img = new Image();
                    img.onload = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img,0,0); c.toBlob(b=>saveAs(b,`${fname}.png`)); };
                    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(finalSvg)));
                }
            } catch(e) { alert("Erro ao gerar mapa: " + e.message); } loader.classList.add('hidden');
        }, 100);
    },

    getDiscreteColor: (hex, pct) => {
        let config = CONFIG.scheme[0];
        for (let i = 0; i < CONFIG.scheme.length; i++) if (pct >= CONFIG.scheme[i].min) config = CONFIG.scheme[i];
        return app.mixColor(hex, config.mix, config.ratio);
    },
    mixColor: (hex1, hex2, amount) => {
        const c1 = app.hexToRgb(hex1), c2 = app.hexToRgb(hex2);
        return `rgb(${Math.round(c1.r + (c2.r - c1.r) * amount)}, ${Math.round(c1.g + (c2.g - c1.g) * amount)}, ${Math.round(c1.b + (c2.b - c1.b) * amount)})`;
    },
    hexToRgb: (hex) => {
        let c = hex.substring(1).split('');
        if(c.length==3) c= [c[0], c[0], c[1], c[1], c[2], c[2]];
        c = '0x'+c.join('');
        return { r: (c>>16)&255, g: (c>>8)&255, b: c&255 };
    },

    bindTooltip: (l, scope, extraProps) => {
        l.bindTooltip(() => {
            const id = app.getFeatureId(l.feature, scope);

                votes = app.calculateLV2026(extraProps);

                if (scope === 'zonas') votes = dataset.zonas ? dataset.zonas[id] : null;
                else if (id.length===2 && scope==='estados') votes = dataset.estados[id];
                else votes = dataset.municipios[id];
            }
            if(!votes) return `Sem dados`;

            const sorted = Object.entries(votes).filter(([c]) => !app.state.ignored.has(c)).sort((a,b)=>b[1]-a[1]);
            if(sorted.length === 0) return `Sem votos válidos`;

            const winnerCand = CONFIG.candidates.find(c=>c.id===sorted[0][0]);
            let title = l.feature.properties.nm_locvot || l.feature.properties.NM_MUN || l.feature.properties.NM_UF || l.feature.properties.name || "Local de Votação";
            const pct = (sorted[0][1] / (sorted.reduce((a,b)=>a+b[1],0)||1)) * 100;
            const photoUrl = LOCAL_PHOTOS[winnerCand.id];

    normalizePcts: (turn) => {
        if(turn === 1) {
            const active = CONFIG.candidates.filter(c => app.state.active_candidates[c.id] !== false);
            const tot = active.reduce((a,c) => a + (app.state.t1_polls[c.id]||0), 0) || 1;
            active.forEach(c => { app.state.t1_polls[c.id] = parseFloat(((app.state.t1_polls[c.id] / tot) * 100).toFixed(2)); });
            app.renderUI(); app.runSimulation();
        } else {
            const [id1, id2] = app.state.t2_finalists; if(!id1 || !id2) return;
            const tot = (app.state.t2_polls[id1]||0) + (app.state.t2_polls[id2]||0) || 1;
            app.state.t2_polls[id1] = parseFloat(((app.state.t2_polls[id1] / tot) * 100).toFixed(2));
            app.state.t2_polls[id2] = parseFloat(((app.state.t2_polls[id2] / tot) * 100).toFixed(2));
            app.updateT2UI(); app.runSimulation();
        }
    },

    updateSidebarRight: () => {
        const title = document.getElementById('regionName'), sub = document.getElementById('regionType'), list = document.getElementById('resultsContainer');
        title.innerText = app.state.selectedName;
        let subTxt = "Nacional";
        if (app.state.level === 'lv' && app.state.currentLVProps) {
            subTxt = "Local de Votação";
        } else if (app.state.selectedId) {
            if (app.state.selectedScope === 'zonas') subTxt = "Zona Eleitoral";
            else if (app.state.selectedId.length === 2) subTxt = "Estado";
            else subTxt = "Município";
        }
        sub.innerText = subTxt; list.innerHTML = '';

        let votes = {};
        if (app.state.level === 'lv' && app.state.currentLVProps) {
            votes = app.calculateLV2026(app.state.currentLVProps);
        } else {
            const dataset = app.state.turn === 1 ? app.data.round1 : app.data.round2; if(!dataset) return;
            if(app.state.selectedId) {
                if (app.state.selectedScope === 'zonas') votes = dataset.zonas ? dataset.zonas[app.state.selectedId] : {};
                else if(app.state.selectedId.length === 2) votes = dataset.estados[app.state.selectedId];
                else votes = dataset.municipios[app.state.selectedId];
            } else votes = dataset.nacional;
        }
        if(!votes) return;

        let totalValid = 0;
        Object.entries(votes).forEach(([c, v]) => {
            if (!app.state.ignored.has(c)) totalValid += v;
        });

        if(document.getElementById('totalVotesVal')) document.getElementById('totalVotesVal').innerText = totalValid.toLocaleString('pt-BR');

        const sorted = Object.entries(votes).sort((a,b) => {
            const aIgn = app.state.ignored.has(a[0]), bIgn = app.state.ignored.has(b[0]);
            if (aIgn !== bIgn) return aIgn ? 1 : -1;
            return b[1] - a[1];
        });

        sorted.forEach(([cid, v]) => {
            const cand = CONFIG.candidates.find(c=>c.id===cid); if(!cand) return;
            if(app.state.turn===1 && app.state.active_candidates[cand.id] === false && v === 0) return;
            const isIgnored = app.state.ignored.has(cid);
            const pct = (!isIgnored && totalValid > 0) ? (v/totalValid)*100 : 0;
            const photoUrl = LOCAL_PHOTOS[cand.id];
            const candColor = app.getCandColor(cand.id);

            const row = document.createElement('div'); row.className = `cand-row ${isIgnored ? 'disabled' : ''}`;
            row.innerHTML = `
                <div class="cand-check ${isIgnored ? '' : 'checked'}"></div>
                <div class="cand-color-dot" style="background:${candColor}" title="Personalizar cor"></div>
                <img src="${photoUrl}" class="cand-avatar" style="--cand-color:${candColor}; width:28px; height:28px;" onerror="app.handleImgFallback(this, '${cand.id}')">
                <div class="cand-info">
                    <div class="cand-head">
                        <span>${cand.name} <small style="color:${candColor}">(${cand.party})</small></span>
                        <span style="color:${candColor}; font-weight:900;">${isIgnored ? '--' : pct.toFixed(2)+'%'}</span>
                    </div>
                    ${!isIgnored ? `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%; background:${candColor}"></div></div>` : ''}
                    <div style="text-align:right; font-size:0.68rem; color:var(--text-muted); margin-top:3px; font-weight:700;">${v.toLocaleString('pt-BR')} votos</div>
                </div>
            `;

            row.querySelector('.cand-check').onclick = (e) => {
                e.stopPropagation();
                if (app.state.ignored.has(cid)) app.state.ignored.delete(cid);
                else app.state.ignored.add(cid);
                app.refreshUI();
            };

            row.querySelector('.cand-color-dot').onclick = (e) => {
                e.stopPropagation();
                app.openColorPicker(cid, candColor, e.target);
            };

            list.appendChild(row);
        });

                        <span style="font-weight:700;">${dest.name}</span>
                    </div>
                    <span id="mod_mtx_${dest.id}" style="font-weight:900; color:var(--accent-blue)">${val}%</span>
                </div>
                <input type="range" min="0" max="100" value="${val}" oninput="app.updateMatrixValue('${src}', '${ufId}', '${dest.id}', this.value); document.getElementById('mod_mtx_${dest.id}').innerText=this.value+'%';">
            `;
            c.appendChild(div);
        });
    },
    updateMatrixValue: (src, ufId, destId, val) => {
        const ratio = parseInt(val)/100;
        if(ufId) {
            if(!app.state.t1_matrix_state[ufId]) app.state.t1_matrix_state[ufId] = {};
            if(!app.state.t1_matrix_state[ufId][src]) app.state.t1_matrix_state[ufId][src] = {...(app.state.t1_matrix[src]||{})};
            app.state.t1_matrix_state[ufId][src][destId] = ratio;
        } else {
            if(!app.state.t1_matrix[src]) app.state.t1_matrix[src] = {};
            app.state.t1_matrix[src][destId] = ratio;
        }
    },

    openStateModal: (turn) => {
        let html = `
            <div style="margin-bottom:15px"><label style="font-size:0.75rem; font-weight:800; color:var(--text-muted)">ESTADO SELECIONADO:</label><select id="modalStateSelect" onchange="app.renderModalStateMults(${turn}, this.value)" style="width:100%"><option value="">Selecione...</option>${STATES.map(s => `<option value="${s.id}">${s.nome} (${s.sigla})</option>`).join('')}</select></div>
            <div id="modalStateContent" style="display:flex; flex-direction:column; gap:8px;"></div>
        `;
        app.openModal(turn === 1 ? "Multiplicadores (1º Turno)" : "Multiplicadores (2º Turno)", html);
    },
    renderModalStateMults: (turn, ufId) => {
        const c = document.getElementById('modalStateContent'); c.innerHTML = ''; if(!ufId) return;
        const store = turn===1 ? app.state.t1_mults : app.state.t2_mults; if(!store[ufId]) store[ufId] = {};
        (turn===1 ? CONFIG.candidates : app.state.t2_finalists.map(id => CONFIG.candidates.find(c=>c.id===id))).forEach(cand => {
            if(!cand || (turn===1 && app.state.active_candidates[cand.id] === false)) return;
            const val = store[ufId][cand.id] !== undefined ? store[ufId][cand.id] : 1.0;
            const photoUrl = LOCAL_PHOTOS[cand.id];
            const candColor = app.getCandColor(cand.id);

            const div = document.createElement('div'); div.className = 'slider-box';
            div.innerHTML = `
                <div class="slider-header">
                    <div class="cand-info-group">
                        <img src="${photoUrl}" class="cand-avatar" style="--cand-color:${candColor}" onerror="app.handleImgFallback(this, '${cand.id}')">
                        <span style="font-weight:700;">${cand.name}</span>
                    </div>
                    <span id="mod_mul_${cand.id}" style="font-weight:900; color:var(--accent-blue)">x${val.toFixed(2)}</span>
                </div>
                <input type="range" min="0" max="300" value="${val*100}" oninput="app.updateMult(${turn}, '${ufId}', '${cand.id}', this.value); document.getElementById('mod_mul_${cand.id}').innerText='x'+(this.value/100).toFixed(2);">
            `;
            c.appendChild(div);
        });
    },
    updateMult: (turn, ufId, cid, val) => {
        const store = turn===1 ? app.state.t1_mults : app.state.t2_mults; if(!store[ufId]) store[ufId] = {};
        store[ufId][cid] = parseInt(val)/100;
    },

    openMigrationModal: () => {
        const[id1, id2] = app.state.t2_finalists;
        const cand1 = CONFIG.candidates.find(c=>c.id===id1), cand2 = CONFIG.candidates.find(c=>c.id===id2);
        let html = `
            <div style="text-align:center; font-size:0.8rem; color:var(--text-muted); margin-bottom:15px">
                Arraste para direcionar a transferência de votos dos candidatos eliminados no 1º turno.<br>
                <strong style="color:${app.getCandColor(id1)}">${cand1.name} (0%)</strong> &bull; <strong style="color:${app.getCandColor(id2)}">${cand2.name} (100%)</strong>
            </div>
            <div id="modalMigContent" style="display:flex; flex-direction:column; gap:8px;"></div>
        `;
        app.openModal("Transferência de Votos (2º Turno)", html);
        const c = document.getElementById('modalMigContent');

        CONFIG.candidates.forEach(cand => {
            if(cand.id === id1 || cand.id === id2 || app.state.active_candidates[cand.id] === false) return;
            const ratio = app.state.t2_migr[cand.id] !== undefined ? app.state.t2_migr[cand.id] : 0.5;
            const photoUrl = LOCAL_PHOTOS[cand.id];
            const candColor = app.getCandColor(cand.id);

            const div = document.createElement('div'); div.className = 'slider-box';
            div.innerHTML = `
                <div class="slider-header">
                    <div class="cand-info-group">
                        <img src="${photoUrl}" class="cand-avatar" style="--cand-color:${candColor}" onerror="app.handleImgFallback(this, '${cand.id}')">
                        <span style="font-weight:700;">Votos de ${cand.name}</span>
                    </div>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-weight:800; margin-bottom:4px;">
                    <span style="color:${app.getCandColor(id1)}">${cand1.name}</span>
                    <span style="color:${app.getCandColor(id2)}">${cand2.name}</span>
                </div>
                <input type="range" min="0" max="100" value="${ratio*100}" oninput="app.state.t2_migr['${cand.id}'] = this.value/100;">
            `;
            c.appendChild(div);
        });
    },

    getMatrixValue: (ufId, src, destId) => {
        return (app.state.t1_matrix_state[ufId] && app.state.t1_matrix_state[ufId][src] && app.state.t1_matrix_state[ufId][src][destId] !== undefined) ? app.state.t1_matrix_state[ufId][src][destId] : (app.state.t1_matrix[src] ? (app.state.t1_matrix[src][destId] || 0) : 0);
    },

    runSimulation: () => {
        if(!app.data.base22) return;
        const loader = document.getElementById('loader'); loader.classList.remove('hidden');
        document.getElementById('loaderMsg').innerText = "Processando Matemática Eleitoral...";
        setTimeout(() => {
            if(app.state.turn === 1) app.calculateTurn1();
            else { if(!app.data.round1) app.calculateTurn1(); app.calculateTurn2(); }
            app.refreshMap(); app.updateSidebarRight(); loader.classList.add('hidden');
        }, 50);
    },

    calculateTurn1: () => {
        const base = app.data.base22.municipios;
        const activeIds = CONFIG.candidates.filter(c => app.state.active_candidates[c.id] !== false).map(c => c.id);
        const rawSliderTotal = activeIds.reduce((sum, id) => sum + (app.state.t1_polls[id]||0), 0);
        const targetPcts = {}; activeIds.forEach(id => { targetPcts[id] = (app.state.t1_polls[id]||0) / (rawSliderTotal || 1); });

        const res = { municipios: {}, estados: {}, nacional: {}, zonas: {} }; let tempNacional = {}, grandTotal = 0;
        const src2022Keys = SOURCES_2022.map(s => s.id);
        
        for(let ibge in base) {
            const votes22 = base[ibge], ufId = ibge.substring(0,2), mVotes = {};
            activeIds.forEach(candId => {
                let sum = 0; 
                src2022Keys.forEach(srcKey => {
                    const rawVal = app.getMatrixValue(ufId, srcKey, candId);
                    let totalActiveWeight = 0; activeIds.forEach(cid => { totalActiveWeight += app.getMatrixValue(ufId, srcKey, cid); });
                    let finalFactor = totalActiveWeight > 0 ? rawVal / totalActiveWeight : 0;
                    sum += app.getVotes22(votes22, srcKey) * finalFactor;
                });
                if(app.state.t1_mults[ufId] && app.state.t1_mults[ufId][candId]) sum *= app.state.t1_mults[ufId][candId];
                mVotes[candId] = sum; tempNacional[candId] = (tempNacional[candId]||0) + sum; grandTotal += sum;
            });
            res.municipios[ibge] = mVotes;
        }

        const corrections = {}; activeIds.forEach(id => { const currPct = tempNacional[id] / (grandTotal||1); corrections[id] = (currPct > 0) ? targetPcts[id]/currPct : 1; });
        for(let ibge in res.municipios) {
            const ufId = ibge.substring(0,2); if(!res.estados[ufId]) res.estados[ufId] = {};
            for(let cid in res.municipios[ibge]) {
                let v = Math.round(res.municipios[ibge][cid] * corrections[cid]);
                res.municipios[ibge][cid] = v;
                res.estados[ufId][cid] = (res.estados[ufId][cid]||0) + v;
                res.nacional[cid] = (res.nacional[cid]||0) + v;
            }
        }
        
        if (app.data.base22.zonas) {
            for(let zId in app.data.base22.zonas) {
                const votes22 = app.data.base22.zonas[zId], ufId = String(zId).substring(0,2), zVotes = {};
                activeIds.forEach(candId => {
                    let sum = 0; 
                    src2022Keys.forEach(srcKey => {
                        const rawVal = app.getMatrixValue(ufId, srcKey, candId);
                        let totalActiveWeight = 0; activeIds.forEach(cid => { totalActiveWeight += app.getMatrixValue(ufId, srcKey, cid); });
                        let finalFactor = totalActiveWeight > 0 ? rawVal / totalActiveWeight : 0;
                        sum += (votes22[srcKey] || 0) * finalFactor;
                    });
                    if(app.state.t1_mults[ufId] && app.state.t1_mults[ufId][candId]) sum *= app.state.t1_mults[ufId][candId];
                    zVotes[candId] = sum;
                });
                res.zonas[zId] = zVotes;
            }
            for(let zId in res.zonas) { for(let cid in res.zonas[zId]) { res.zonas[zId][cid] = Math.round(res.zonas[zId][cid] * corrections[cid]); } }
        }
        
        app.data.round1 = res;
    },

    calculateTurn2: () => {
        if(!app.data.round1) app.calculateTurn1(); const r1 = app.data.round1;
        const[id1, id2] = app.state.t2_finalists; if(!id1 || !id2) return;
        const isOrganic = app.state.t2_mode === 'organic';

        const res = { municipios: {}, estados: {}, nacional: {}, zonas: {} }; let tempNacional = {[id1]:0, [id2]:0}, grandTotal = 0;
        for(let ibge in r1.municipios) {
            const v1 = r1.municipios[ibge], ufId = ibge.substring(0,2); let vA = 0, vB = 0;
            for(let cid in v1) {
                const votos = v1[cid];
                if(cid === id1) vA += votos;
                else if(cid === id2) vB += votos;
                else {
                    let ratio = app.state.t2_migr[cid] !== undefined ? app.state.t2_migr[cid] : 0.5;
                    vA += votos * (1 - ratio); vB += votos * ratio;
                }
            }
            if(app.state.t2_mults[ufId]) {
                if(app.state.t2_mults[ufId][id1]) vA *= app.state.t2_mults[ufId][id1];
                if(app.state.t2_mults[ufId][id2]) vB *= app.state.t2_mults[ufId][id2];
            }
            vA = Math.round(vA); vB = Math.round(vB); tempNacional[id1] += vA; tempNacional[id2] += vB; grandTotal += (vA + vB);
            res.municipios[ibge] = { [id1]: vA, [id2]: vB };
        }

        if(!isOrganic) {
            const totalSlider = (app.state.t2_polls[id1]||0) + (app.state.t2_polls[id2]||0);
            const targetPcts = { [id1]: (app.state.t2_polls[id1]||0)/(totalSlider||1), [id2]: (app.state.t2_polls[id2]||0)/(totalSlider||1) };
            const corrections = {}; [id1, id2].forEach(id => { const currPct = tempNacional[id] / (grandTotal||1); corrections[id] = (app.state.t2_polls[id]<=0) ? 0 : (currPct>0 ? targetPcts[id]/currPct : 1); });
            res.nacional = {};
            for(let ibge in res.municipios) {
                const ufId = ibge.substring(0,2); if(!res.estados[ufId]) res.estados[ufId] = {};
                [id1, id2].forEach(id => {
                    let v = Math.round(res.municipios[ibge][id] * corrections[id]);
                    res.municipios[ibge][id] = v; res.estados[ufId][id] = (res.estados[ufId][id]||0) + v; res.nacional[id] = (res.nacional[id]||0) + v;
                });
            }
        } else {
            res.nacional = tempNacional;
            for(let ibge in res.municipios) {
                const ufId = ibge.substring(0,2); if(!res.estados[ufId]) res.estados[ufId] = {};
                [id1, id2].forEach(id => { let v = res.municipios[ibge][id]; res.estados[ufId][id] = (res.estados[ufId][id]||0) + v; });
            }
            const t = grandTotal || 1;
            app.state.t2_polls[id1] = parseFloat(((tempNacional[id1]/t)*100).toFixed(2));
            app.state.t2_polls[id2] = parseFloat(((tempNacional[id2]/t)*100).toFixed(2));
            if(document.getElementById(`input_t2_${id1}`)) document.getElementById(`input_t2_${id1}`).value = app.state.t2_polls[id1].toFixed(2);
            if(document.getElementById(`input_t2_${id2}`)) document.getElementById(`input_t2_${id2}`).value = app.state.t2_polls[id2].toFixed(2);
            app.checkT2Total();
        }

        if (r1.zonas) {
            for(let zId in r1.zonas) {
                const v1 = r1.zonas[zId], ufId = String(zId).substring(0,2); let vA = 0, vB = 0;
                for(let cid in v1) {
                    const votos = v1[cid];
                    if(cid === id1) vA += votos; else if(cid === id2) vB += votos;
                    else { let ratio = app.state.t2_migr[cid] !== undefined ? app.state.t2_migr[cid] : 0.5; vA += votos * (1 - ratio); vB += votos * ratio; }
                }
                if(app.state.t2_mults[ufId]) {
                    if(app.state.t2_mults[ufId][id1]) vA *= app.state.t2_mults[ufId][id1];
                    if(app.state.t2_mults[ufId][id2]) vB *= app.state.t2_mults[ufId][id2];
                }
                vA = Math.round(vA); vB = Math.round(vB); res.zonas[zId] = { [id1]: vA, [id2]: vB };
            }
            if(!isOrganic) {
                const totalSlider = (app.state.t2_polls[id1]||0) + (app.state.t2_polls[id2]||0);
                const targetPcts = { [id1]: (app.state.t2_polls[id1]||0)/(totalSlider||1), [id2]: (app.state.t2_polls[id2]||0)/(totalSlider||1) };
                const corrections = {}; [id1, id2].forEach(id => { const currPct = tempNacional[id] / (grandTotal||1); corrections[id] = (app.state.t2_polls[id]<=0) ? 0 : (currPct>0 ? targetPcts[id]/currPct : 1); });
                for(let zId in res.zonas) { [id1, id2].forEach(id => { res.zonas[zId][id] = Math.round(res.zonas[zId][id] * corrections[id]); }); }
            }
        }
        app.data.round2 = res;
    },

    getVotes22: (obj, key) => {
        let sum = 0;
        const aliases = CAND_2022_ALIASES[key] || [key];
        for (let k in obj) {
            const kUpper = k.toUpperCase();
            if (aliases.some(alias => kUpper.includes(alias))) {
                sum += obj[k];
            }
        }
        return sum;
    }
};

document.addEventListener('DOMContentLoaded', app.init);
</script>
</body>
</html>
