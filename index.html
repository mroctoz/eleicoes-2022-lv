<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleições 2022 – Brasil por Local de Votação</title>
    
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Fonts/Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Color Picker -->
    <link href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

    <style>
        :root {
            --bg: #0d1117;
            --sidebar-bg: #161b22;
            --border: #30363d;
            --text: #f0f6fc;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --btn-bg: #21262d;
            --btn-hover: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
        #app { display: grid; grid-template-columns: 280px 1fr 280px; height: 100vh; width: 100vw; }
        .sidebar { background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; z-index: 1000; }
        .sidebar-right { border-right: none; border-left: 1px solid var(--border); }
        .header { padding: 20px; border-bottom: 1px solid var(--border); }
        .header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
        .header h2 { font-size: 1.1rem; font-weight: 700; }
        .controls { padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; font-weight: 600; }
        select, .btn-primary, .btn-back {
            background: var(--btn-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }
        select:hover, .btn-primary:hover, .btn-back:hover { background: var(--btn-hover); border-color: #555; }
        .btn-primary { background: #238636; border-color: #2ea043; font-weight: 600; }
        .btn-primary:hover { background: #2ea043; }
        .btn-back { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        #map { height: 100%; width: 100%; z-index: 1; }
        .map-controls { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
        .map-btn { width: 42px; height: 42px; background: rgba(22,27,34,0.9); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-size: 1rem; transition: all 0.2s; }
        .map-btn:hover { background: var(--btn-hover); }
        .legend { position: absolute; bottom: 20px; left: 20px; background: rgba(22,27,34,0.95); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; z-index: 1000; color: white; width: 200px; }
        .legend-grid { display: flex; gap: 2px; margin-top: 6px; }
        .legend-item { flex: 1; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.3); }
        .cand-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.2s; }
        .cand-row:hover { background: rgba(255,255,255,0.05); }
        .cand-row.disabled { opacity: 0.4; }
        .cand-check { width: 18px; height: 18px; border: 2px solid #555; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
        .cand-check.checked { background: var(--accent); border-color: var(--accent); }
        .cand-check.checked::after { content: '✓'; color: white; }
        .cand-color { width: 16px; height: 16px; border-radius: 4px; cursor: pointer; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.5); }
        .cand-color:hover { transform: scale(1.3); }
        .cand-info { flex: 1; min-width: 0; }
        .cand-head { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.8rem; }
        .cand-sub { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
        .progress-bar { height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 4px; }
        .progress-fill { height: 100%; border-radius: 2px; }
        .custom-tooltip { background: rgba(13,17,23,0.95); border: 1px solid var(--border); border-radius: 10px; padding: 10px; color: white; font-size: 0.85rem; }
        .tt-head { font-weight: 700; margin-bottom: 4px; }
        .tt-body { margin-top: 4px; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
        .spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loader" class="hidden">
    <div class="spinner"></div>
    <h3 id="loaderText">Carregando dados...</h3>
</div>

<div id="app">
    <!-- BARRA ESQUERDA -->
    <aside class="sidebar">
        <div class="header">
            <h1>🗳️ Eleições 2022</h1>
            <div style="font-size: 0.75rem; color: var(--accent);">Resultado por Local de Votação</div>
        </div>
        <div class="controls">
            <div class="control-group">
                <label>TURNO</label>
                <select id="turnSelect">
                    <option value="1">1º Turno</option>
                    <option value="2">2º Turno</option>
                </select>
            </div>
            <div class="control-group">
                <label>CARGO</label>
                <select id="roleSelect"></select>
            </div>
            <button class="btn-primary" onclick="app.refreshMap()"><i class="fas fa-sync-alt"></i> ATUALIZAR MAPA</button>
            <div style="font-size:0.65rem;color:var(--text-muted);margin-top:1rem;">
                Clique em um estado e depois em um município para ver os locais de votação.
            </div>
        </div>
    </aside>

    <!-- MAPA -->
    <div id="map"></div>

    <!-- BARRA DIREITA -->
    <aside class="sidebar sidebar-right">
        <div class="header">
            <h2 id="regionName">Brasil</h2>
            <div style="font-size: 0.8rem; color: var(--accent);" id="regionType">Nacional</div>
        </div>
        <div style="padding: 15px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border);">
            <button id="btnBack" class="btn-back" style="display: none;" onclick="app.resetSelection()">
                <i class="fas fa-arrow-left"></i> Voltar
            </button>
            <button id="btnToggleLV" class="btn-back" style="display: none;" onclick="app.toggleLVMode()">
                <i class="fas fa-map-marker-alt"></i> <span id="btnToggleLVText">Ver Locais de Votação</span>
            </button>
            <div style="font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted);">Votos Totais</div>
            <div id="totalVotesVal" style="font-size: 1.4rem; font-weight: 800; color: white;">-</div>
        </div>
        <div class="controls" id="resultsContainer"></div>
    </aside>

    <!-- CONTROLES DO MAPA -->
    <div class="map-controls">
        <div class="map-btn" onclick="app.map.zoomIn()">+</div>
        <div class="map-btn" onclick="app.map.zoomOut()">−</div>
    </div>

    <!-- LEGENDA -->
    <div class="legend">
        <div style="font-size:0.7rem;margin-bottom:6px;font-weight:700;">Percentual do Vencedor</div>
        <div class="legend-grid" id="legendColors"></div>
        <div style="display:flex;justify-content:space-between;font-size:0.6rem;color:#aaa;margin-top:4px;">
            <span>≤20%</span><span>100%</span>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ---------- CONFIGURAÇÕES ----------
        const API_BASE = "https://octoz-eleicoes2022-api.hf.space";
        const DATASET_BASE = "https://huggingface.co/datasets/octoz/dataLV/resolve/main";

        const GRADIENT_SCHEME = [
            { min: 0,  mix: '#ffffff', ratio: 0.85, ref: '#E6E6E6' },
            { min: 20, mix: '#ffffff', ratio: 0.65, ref: '#CCCCCC' },
            { min: 30, mix: '#ffffff', ratio: 0.45, ref: '#B2B2B2' },
            { min: 40, mix: '#ffffff', ratio: 0.25, ref: '#999999' },
            { min: 50, mix: '#000000', ratio: 0.10, ref: '#808080' },
            { min: 60, mix: '#000000', ratio: 0.25, ref: '#666666' },
            { min: 70, mix: '#000000', ratio: 0.45, ref: '#4D4D4D' },
            { min: 80, mix: '#000000', ratio: 0.60, ref: '#343434' },
            { min: 90, mix: '#000000', ratio: 0.75, ref: '#202020' },
            { min: 100,mix: '#000000', ratio: 0.90, ref: '#000000' }
        ];

        const PARTY_COLORS = {
            'PT': '#E12525', 'PL': '#0056A8', 'PSB': '#E12525', 'PDT': '#F58220',
            'UNIÃO': '#0056A8', 'PSDB': '#009EE3', 'MDB': '#008000', 'PSD': '#FAA21B',
            'PP': '#0066CC', 'NOVO': '#F58220', 'REPUBLICANOS': '#0066CC',
            'SOLIDARIEDADE': '#F58220', 'PATRIOTA': '#FFD700', 'PCdoB': '#FF0000',
            'PV': '#00FF00', 'CIDADANIA': '#FFA500', 'AVANTE': '#800080',
            'PSOL': '#FFCC00', 'REDE': '#00FF7F', 'OUTROS': '#666666', 'DEFAULT': '#555555'
        };

        // ---------- APLICAÇÃO ----------
        const app = {
            map: null,
            layers: { brazil: null, cities: null, lv: null },
            data: {
                ufData: null,
                aggMunicipios: {},
                aggEstados: {},
                brasilMunicipiosGeoJSON: null,
                lvGeoJSON: {}
            },
            state: {
                role: 'Presidente',
                turn: '1',
                selectedId: null,
                selectedName: "Brasil",
                lvMode: false,
                ignored: new Set(),
                customColors: JSON.parse(localStorage.getItem('v2022_colors') || '{}')
            },
            rolesList: [],

            async init() {
                // Inicializa o mapa
                this.map = L.map('map', {
                    center: [-15, -50],
                    zoom: 4,
                    zoomControl: false,
                    preferCanvas: true
                });
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { opacity: 0.4 }).addTo(this.map);

                // Legenda
                const legendDiv = document.getElementById('legendColors');
                [20,30,40,50,60,70,80,90,100].forEach(pct => {
                    const el = document.createElement('div');
                    el.className = 'legend-item';
                    el.style.background = this.getGradientConfig(pct).ref;
                    legendDiv.appendChild(el);
                });

                await this.discoverRoles();
                this.setupEventListeners();
                this.loadBrazilLayer();
            },

            setupEventListeners() {
                document.getElementById('turnSelect').addEventListener('change', e => {
                    this.state.turn = e.target.value;
                    this.aggregateAndRefresh();
                });
                document.getElementById('roleSelect').addEventListener('change', e => {
                    this.state.role = e.target.value;
                    this.aggregateAndRefresh();
                });
            },

            async discoverRoles() {
                try {
                    const res = await fetch(`${API_BASE}/uf/35`);
                    const data = await res.json();
                    this.rolesList = [...new Set(data.map(r => r.DS_CARGO?.trim()))].filter(Boolean).sort();
                } catch (e) {
                    this.rolesList = ['Presidente', 'Governador', 'Senador', 'Deputado Federal', 'Deputado Estadual'];
                }
                const select = document.getElementById('roleSelect');
                select.innerHTML = this.rolesList.map(r => `<option value="${r}">${r}</option>`).join('');
                this.state.role = this.rolesList[0] || 'Presidente';
                select.value = this.state.role;
            },

            // ---------- DADOS DA UF ----------
            async loadUFData(uf) {
                const loader = document.getElementById('loader');
                loader.classList.remove('hidden');
                document.getElementById('loaderText').textContent = `Carregando dados do estado...`;
                try {
                    const res = await fetch(`${API_BASE}/uf/${uf}`);
                    if (!res.ok) throw new Error(`Erro ao carregar UF ${uf}`);
                    this.data.ufData = await res.json();
                    this.aggregateUFData();
                } catch (e) {
                    console.error(e);
                    alert('Falha ao carregar os dados do estado.');
                }
                loader.classList.add('hidden');
            },

            aggregateUFData() {
                const turn = this.state.turn;
                const cargo = this.state.role;
                const aggMun = {};
                const aggEst = {};

                (this.data.ufData || []).forEach(item => {
                    const turno = String(item.turno || '').trim();
                    const dsCargo = String(item.DS_CARGO || '').trim();
                    if (turno !== turn || dsCargo !== cargo) return;

                    const parts = String(item.lv_id || '').split('_');
                    const codMun = parts[0];
                    if (!codMun) return;
                    const codUF = codMun.substring(0, 2);
                    const candKey = `${item.NM_VOTAVEL} (${this.extractParty(item)})`;
                    const votes = Number(item.QT_VOTOS) || 0;

                    if (!aggMun[codMun]) aggMun[codMun] = {};
                    aggMun[codMun][candKey] = (aggMun[codMun][candKey] || 0) + votes;

                    if (!aggEst[codUF]) aggEst[codUF] = {};
                    aggEst[codUF][candKey] = (aggEst[codUF][candKey] || 0) + votes;
                });

                this.data.aggMunicipios = aggMun;
                this.data.aggEstados = aggEst;
                console.log(`Agregados: ${Object.keys(aggMun).length} municípios, ${Object.keys(aggEst).length} UFs`);
            },

            extractParty(item) {
                const num = String(item.NR_VOTAVEL || '').trim();
                const mapNum = {'13':'PT','22':'PL','12':'PDT','45':'PSDB','15':'MDB','55':'PSD','50':'PSOL','11':'PP','10':'REPUBLICANOS','14':'PTB','43':'PV','23':'CIDADANIA','40':'PSB','65':'PCdoB','30':'NOVO','77':'SOLIDARIEDADE','28':'PRTB','51':'PATRIOTA','35':'PMB','44':'PRP','18':'REDE','70':'AVANTE','80':'UP','90':'PROS','19':'PODE','27':'DC','36':'AGIR','29':'PCO','16':'PSTU','21':'PCB'};
                return mapNum[num] || 'OUTROS';
            },

            aggregateAndRefresh() {
                if (this.data.ufData) this.aggregateUFData();
                this.refreshMapStyle();
                this.updateSidebar();
            },

            // ---------- CAMADA BRASIL ----------
            async loadBrazilLayer() {
                const res = await fetch('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/brazil-states.geojson');
                const data = await res.json();
                const ufMap = {'AC':'12','AL':'27','AM':'13','AP':'16','BA':'29','CE':'23','DF':'53','ES':'32','GO':'52','MA':'21','MG':'31','MS':'50','MT':'51','PA':'15','PB':'25','PE':'26','PI':'22','PR':'41','RJ':'33','RN':'24','RO':'11','RR':'14','RS':'43','SC':'42','SE':'28','SP':'35','TO':'17'};
                data.features.forEach(f => f.properties.id = ufMap[f.properties.sigla]);

                this.layers.brazil = L.geoJSON(data, {
                    smoothFactor: 0.5,
                    style: f => this.getStyle(f, 'estados'),
                    onEachFeature: (f, l) => {
                        l.on('click', () => this.onStateClick(f.properties.id, f.properties.name));
                        this.bindTooltip(l, f.properties.id, 'estados', f.properties.name);
                    }
                }).addTo(this.map);
            },

            // ---------- NAVEGAÇÃO ----------
            async onStateClick(ufId, ufName) {
                await this.loadUFData(ufId);
                this.selectRegion(ufId, ufName);
                await this.loadStateMunicipalities(ufId, ufName);
            },

            async loadStateMunicipalities(ufId, ufName) {
                const loader = document.getElementById('loader');
                loader.classList.remove('hidden');
                document.getElementById('loaderText').textContent = 'Carregando malha municipal...';
                try {
                    if (!this.data.brasilMunicipiosGeoJSON) {
                        const res = await fetch('https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-100-mun.json');
                        this.data.brasilMunicipiosGeoJSON = await res.json();
                    }
                    const feats = this.data.brasilMunicipiosGeoJSON.features.filter(f => {
                        const id = f.properties.id || f.properties.codarea;
                        return id && id.toString().startsWith(ufId);
                    });

                    if (this.layers.cities) this.map.removeLayer(this.layers.cities);
                    if (this.layers.lv) this.map.removeLayer(this.layers.lv);
                    if (this.layers.brazil) this.map.removeLayer(this.layers.brazil);

                    this.layers.cities = L.geoJSON({ type: 'FeatureCollection', features: feats }, {
                        smoothFactor: 0.3,
                        style: f => this.getStyle(f, 'municipios'),
                        onEachFeature: (f, l) => {
                            const id = f.properties.id || f.properties.codarea;
                            const name = f.properties.name || '';
                            l.on('click', () => this.onMunicipalityClick(id, name));
                            this.bindTooltip(l, id, 'municipios', name);
                        }
                    }).addTo(this.map);
                    this.map.fitBounds(this.layers.cities.getBounds());

                    document.getElementById('btnToggleLV').style.display = 'flex';
                    document.getElementById('btnToggleLVText').textContent = 'Ver Locais de Votação';
                    this.state.lvMode = false;
                } catch (e) {
                    console.error(e);
                }
                loader.classList.add('hidden');
            },

            async onMunicipalityClick(munCode, munName) {
                const uf = munCode.substring(0, 2);
                await this.loadLVGeoJSON(uf);
                const lvFeats = this.data.lvGeoJSON[uf].features.filter(f => {
                    const lvId = f.properties.lv_id || '';
                    return lvId.startsWith(munCode + '_');
                });
                if (lvFeats.length === 0) {
                    alert('Nenhum local de votação neste município.');
                    return;
                }
                this.displayLVLayer(lvFeats, munName, munCode);
            },

            toggleLVMode() {
                if (!this.state.selectedId || this.state.selectedId.length !== 2) return;
                const uf = this.state.selectedId;
                if (this.state.lvMode) {
                    this.loadStateMunicipalities(uf, this.state.selectedName);
                } else {
                    this.loadStateLVs(uf, this.state.selectedName);
                }
            },

            async loadStateLVs(ufId, ufName) {
                await this.loadUFData(ufId);
                this.aggregateUFData();
                await this.loadLVGeoJSON(ufId);
                this.displayLVLayer(this.data.lvGeoJSON[ufId].features, ufName, ufId);
                this.state.lvMode = true;
                document.getElementById('btnToggleLVText').textContent = 'Ver Municípios';
            },

            async loadLVGeoJSON(uf) {
                if (this.data.lvGeoJSON[uf]) return;
                const loader = document.getElementById('loader');
                loader.classList.remove('hidden');
                document.getElementById('loaderText').textContent = 'Carregando malha de locais de votação...';
                try {
                    const res = await fetch(`${DATASET_BASE}/lv_${uf}.geojson`);
                    if (!res.ok) throw new Error(`Arquivo lv_${uf}.geojson não encontrado`);
                    this.data.lvGeoJSON[uf] = await res.json();
                } catch (e) {
                    alert(e.message);
                }
                loader.classList.add('hidden');
            },

            displayLVLayer(features, regionName, regionId) {
                if (this.layers.cities) this.map.removeLayer(this.layers.cities);
                if (this.layers.lv) this.map.removeLayer(this.layers.lv);
                if (this.layers.brazil) this.map.removeLayer(this.layers.brazil);

                this.layers.lv = L.geoJSON({ type: 'FeatureCollection', features }, {
                    smoothFactor: 0.2,
                    style: f => this.getLVStyle(f),
                    onEachFeature: (f, l) => {
                        const lvId = f.properties.lv_id || '';
                        l.on('click', () => this.selectRegion(lvId, f.properties.nm_locvot || 'Local'));
                        this.bindLVTooltip(l, lvId);
                    }
                }).addTo(this.map);
                this.map.fitBounds(this.layers.lv.getBounds());
                this.selectRegion(regionId, regionName);
            },

            // ---------- ESTILOS ----------
            getStyle(feature, scope) {
                const id = feature.properties.id || feature.properties.codarea;
                const votes = scope === 'estados' ? this.data.aggEstados[id] : this.data.aggMunicipios[id];
                const stats = this.recalcStats(votes || {});
                if (!stats || !stats.winner) return { fillColor: '#222', weight: 0.2, color: '#ffffff', fillOpacity: 1 };
                const party = stats.winner.split(' (')[1]?.replace(')','') || 'DEFAULT';
                const color = this.getDiscreteColor(this.getCandColor(party), stats.pct);
                return {
                    fillColor: color,
                    weight: scope === 'estados' ? 0.6 : 0.2,
                    color: '#ffffff',
                    fillOpacity: 1,
                    lineJoin: 'round',
                    lineCap: 'round'
                };
            },

            getLVStyle(feature) {
                const lvId = feature.properties.lv_id || '';
                const votes = this.getLVRawVotes(lvId);
                const stats = this.recalcStats(votes);
                if (!stats || !stats.winner) return { fillColor: '#222', weight: 0.2, color: '#ffffff', fillOpacity: 1 };
                const party = stats.winner.split(' (')[1]?.replace(')','') || 'DEFAULT';
                const color = this.getDiscreteColor(this.getCandColor(party), stats.pct);
                return {
                    fillColor: color,
                    weight: 0.2,
                    color: '#ffffff',
                    fillOpacity: 1,
                    lineJoin: 'round',
                    lineCap: 'round'
                };
            },

            getLVRawVotes(lvId) {
                const votes = {};
                (this.data.ufData || []).forEach(item => {
                    if (String(item.turno || '').trim() === this.state.turn &&
                        String(item.DS_CARGO || '').trim() === this.state.role &&
                        String(item.lv_id || '').trim() === lvId) {
                        const candKey = `${item.NM_VOTAVEL} (${this.extractParty(item)})`;
                        votes[candKey] = (votes[candKey] || 0) + (Number(item.QT_VOTOS) || 0);
                    }
                });
                return votes;
            },

            // ---------- CORES E GRADIENTE ----------
            getGradientConfig(pct) {
                for (let i = GRADIENT_SCHEME.length-1; i >= 0; i--) {
                    if (pct >= GRADIENT_SCHEME[i].min) return GRADIENT_SCHEME[i];
                }
                return GRADIENT_SCHEME[0];
            },

            getDiscreteColor(hex, pct) {
                const cfg = this.getGradientConfig(pct);
                return this.mixColor(hex, cfg.mix, cfg.ratio);
            },

            mixColor(hex1, hex2, amount) {
                const c1 = this.hexToRgb(hex1);
                const c2 = this.hexToRgb(hex2);
                const r = Math.round(c1.r + (c2.r - c1.r) * amount);
                const g = Math.round(c1.g + (c2.g - c1.g) * amount);
                const b = Math.round(c1.b + (c2.b - c1.b) * amount);
                return `rgb(${r},${g},${b})`;
            },

            hexToRgb(hex) {
                let h = hex.substring(1);
                if (h.length === 3) h = h.split('').map(x => x + x).join('');
                const n = parseInt(h, 16);
                return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
            },

            getCandColor(party) {
                return this.state.customColors[party] || PARTY_COLORS[party] || PARTY_COLORS.DEFAULT;
            },

            // ---------- ESTATÍSTICAS ----------
            recalcStats(votes) {
                let total = 0, max = -1, winner = null;
                const rank = [];
                Object.entries(votes).forEach(([cand, votos]) => {
                    if (!this.state.ignored.has(cand)) {
                        total += votos;
                        if (votos > max) { max = votos; winner = cand; }
                        rank.push({ cand, votes: votos, pct: 0 });
                    } else {
                        rank.push({ cand, votes: 0, pct: 0, ignored: true, orig: votos });
                    }
                });
                if (total === 0 && rank.filter(r => !r.ignored).length === 0) return null;
                rank.forEach(r => { if (!r.ignored) r.pct = (r.votes / total) * 100; });
                rank.sort((a, b) => (b.ignored ? -1 : b.votes) - (a.ignored ? -1 : a.votes));
                return { total, winner, pct: winner ? (max / total) * 100 : 0, ranking: rank };
            },

            // ---------- UI DA SIDEBAR ----------
            selectRegion(id, name) {
                this.state.selectedId = id;
                this.state.selectedName = name;
                document.getElementById('btnBack').style.display = 'flex';
                if (id.length === 2 && !this.state.lvMode) {
                    document.getElementById('btnToggleLV').style.display = 'flex';
                    document.getElementById('btnToggleLVText').textContent = 'Ver Locais de Votação';
                } else {
                    document.getElementById('btnToggleLV').style.display = 'none';
                }
                this.updateSidebar();
            },

            resetSelection() {
                this.state.selectedId = null;
                this.state.selectedName = "Brasil";
                document.getElementById('btnBack').style.display = 'none';
                document.getElementById('btnToggleLV').style.display = 'none';
                if (this.layers.cities) this.map.removeLayer(this.layers.cities);
                if (this.layers.lv) this.map.removeLayer(this.layers.lv);
                this.layers.brazil.addTo(this.map);
                this.map.setView([-15, -50], 4);
                this.updateSidebar();
            },

            updateSidebar() {
                const titleEl = document.getElementById('regionName');
                const totalEl = document.getElementById('totalVotesVal');
                const container = document.getElementById('resultsContainer');
                titleEl.textContent = this.state.selectedName;
                container.innerHTML = '';

                let rawVotes = {};
                if (!this.state.selectedId) {
                    Object.values(this.data.aggEstados).forEach(st =>
                        Object.entries(st).forEach(([c, v]) => rawVotes[c] = (rawVotes[c] || 0) + v)
                    );
                } else if (this.state.selectedId.length === 2) {
                    rawVotes = this.data.aggEstados[this.state.selectedId] || {};
                } else {
                    rawVotes = this.getLVRawVotes(this.state.selectedId);
                }

                const stats = this.recalcStats(rawVotes);
                if (!stats) {
                    totalEl.textContent = '0';
                    container.innerHTML = '<div style="color:#666;text-align:center;">Sem dados para esta seleção</div>';
                    return;
                }
                totalEl.textContent = stats.total.toLocaleString('pt-BR');

                stats.ranking.forEach(r => {
                    const name = r.cand.split(' (')[0];
                    const party = r.cand.split(' (')[1]?.replace(')', '') || 'DEFAULT';
                    const color = this.getCandColor(party);
                    const isIgnored = r.ignored;

                    const div = document.createElement('div');
                    div.className = `cand-row ${isIgnored ? 'disabled' : ''}`;
                    div.innerHTML = `
                        <div class="cand-check ${isIgnored ? '' : 'checked'}"></div>
                        <div class="cand-color" style="background:${color}"></div>
                        <div class="cand-info">
                            <div class="cand-head">
                                <span>${name}</span>
                                <span style="color:${color}">${isIgnored ? '--' : r.pct.toFixed(2) + '%'}</span>
                            </div>
                            <div class="cand-sub">
                                <span>${party}</span>
                                <span>${isIgnored ? (r.orig || 0).toLocaleString() : r.votes.toLocaleString()}</span>
                            </div>
                            ${!isIgnored ? `<div class="progress-bar"><div class="progress-fill" style="width:${r.pct}%; background:${color}"></div></div>` : ''}
                        </div>
                    `;

                    div.querySelector('.cand-check').onclick = () => {
                        if (this.state.ignored.has(r.cand)) this.state.ignored.delete(r.cand);
                        else this.state.ignored.add(r.cand);
                        this.refreshMapStyle();
                        this.updateSidebar();
                    };

                    div.querySelector('.cand-color').onclick = e => {
                        e.stopPropagation();
                        this.openColorPicker(party, color, e.target);
                    };

                    container.appendChild(div);
                });
            },

            refreshMapStyle() {
                if (this.layers.brazil) this.layers.brazil.setStyle(f => this.getStyle(f, 'estados'));
                if (this.layers.cities) this.layers.cities.setStyle(f => this.getStyle(f, 'municipios'));
                if (this.layers.lv) this.layers.lv.setStyle(f => this.getLVStyle(f));
            },

            openColorPicker(party, defColor, el) {
                const pickr = Pickr.create({
                    el,
                    theme: 'nano',
                    default: defColor,
                    swatches: Object.values(PARTY_COLORS).slice(0, 8),
                    components: { preview: true, hue: true, interaction: { save: true } }
                });
                pickr.on('save', color => {
                    this.state.customColors[party] = color.toHEXA().toString();
                    localStorage.setItem('v2022_colors', JSON.stringify(this.state.customColors));
                    el.style.background = color.toHEXA().toString();
                    this.refreshMapStyle();
                    this.updateSidebar();
                    pickr.destroyAndRemove();
                });
            },

            // ---------- TOOLTIPS ----------
            bindTooltip(layer, id, scope, name) {
                layer.bindTooltip(() => {
                    const votes = scope === 'estados' ? this.data.aggEstados[id] : this.data.aggMunicipios[id];
                    const stats = this.recalcStats(votes || {});
                    if (!stats) return `<div class="custom-tooltip"><div class="tt-head">${name || id}</div><div class="tt-body">Sem dados</div></div>`;
                    const wName = stats.winner.split(' (')[0];
                    const party = stats.winner.split(' (')[1]?.replace(')', '') || '';
                    const color = this.getCandColor(party);
                    return `<div class="custom-tooltip">
                        <div class="tt-head">${name || id}</div>
                        <div class="tt-body">
                            <div style="color:${color}; font-weight:800;">${wName} – ${stats.pct.toFixed(1)}%</div>
                            <div style="font-size:0.8rem;">${stats.total.toLocaleString()} votos</div>
                        </div>
                    </div>`;
                }, { sticky: true, direction: 'top' });
            },

            bindLVTooltip(layer, lvId) {
                layer.bindTooltip(() => {
                    const votes = this.getLVRawVotes(lvId);
                    const stats = this.recalcStats(votes);
                    if (!stats) return '<div class="custom-tooltip">Sem dados</div>';
                    const wName = stats.winner.split(' (')[0];
                    const party = stats.winner.split(' (')[1]?.replace(')', '') || '';
                    const color = this.getCandColor(party);
                    return `<div class="custom-tooltip">
                        <div class="tt-head">Local de Votação</div>
                        <div class="tt-body">
                            <div style="color:${color}; font-weight:800;">${wName} – ${stats.pct.toFixed(1)}%</div>
                            <div style="font-size:0.8rem;">${stats.total.toLocaleString()} votos</div>
                        </div>
                    </div>`;
                }, { sticky: true, direction: 'top' });
            },

            refreshMap() {
                if (this.state.selectedId && this.state.selectedId.length === 2) {
                    this.onStateClick(this.state.selectedId, this.state.selectedName);
                } else {
                    this.resetSelection();
                }
            }
        };

        window.app = app;
        document.addEventListener('DOMContentLoaded', () => app.init());
    })();
</script>
