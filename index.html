<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eleições Historicas View – 1994 a 2022 & Locais de Votação</title>

<!-- Leaflet Mapa -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Proj4js (Reprojeção EPSG:5880 SIRGAS 2000 → WGS84) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<!-- Color Picker (Pickr) -->
<link href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

<!-- Export Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
    :root {
        --bg-color: #0b0f19;
        --sidebar-bg: rgba(15, 23, 42, 0.92);
        --sidebar-border: rgba(255, 255, 255, 0.08);
        --card-bg: rgba(30, 41, 59, 0.65);
        --card-border: rgba(255, 255, 255, 0.08);
        --card-hover: rgba(51, 65, 85, 0.8);
        --text-color: #f8fafc;
        --text-muted: #94a3b8;
        --accent-blue: #3b82f6;
        --accent-cyan: #06b6d4;
        --accent-green: #10b981;
        --input-bg: rgba(15, 23, 42, 0.7);
        --shadow-elevation: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 8px;
    }

    .light-theme {
        --bg-color: #f1f5f9;
        --sidebar-bg: rgba(255, 255, 255, 0.95);
        --sidebar-border: #cbd5e1;
        --card-bg: #ffffff;
        --card-border: #e2e8f0;
        --card-hover: #f8fafc;
        --text-color: #0f172a;
        --text-muted: #64748b;
        --accent-blue: #2563eb;
        --accent-cyan: #0284c7;
        --accent-green: #059669;
        --input-bg: #f8fafc;
        --shadow-elevation: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* APP LAYOUT GRID */
    #app {
        display: grid;
        grid-template-columns: 360px 1fr 350px;
        height: 100vh;
        width: 100vw;
        position: relative;
        overflow: hidden;
    }

    /* SIDEBARS COM FIXAÇÃO DE ALTURA PARA SCROLL PERFECT */
    .sidebar, .sidebar-right {
        background: var(--sidebar-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-right: 1px solid var(--sidebar-border);
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-height: 100vh;
        overflow: hidden;
        z-index: 1000;
        box-shadow: var(--shadow-elevation);
        transition: all 0.3s ease;
    }
    .sidebar-right {
        border-right: none;
        border-left: 1px solid var(--sidebar-border);
    }

    /* HEADER STYLING */
    .header {
        padding: 16px 18px;
        border-bottom: 1px solid var(--sidebar-border);
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex-shrink: 0;
    }
    .brand-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .brand-title h1 {
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, var(--text-color) 30%, var(--accent-blue));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* IO BUTTONS BAR */
    .io-buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
    }
    .btn-io {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        color: var(--text-color);
        padding: 8px 4px;
        border-radius: var(--radius-sm);
        font-size: 0.7rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        transition: all 0.2s ease;
    }
    .btn-io:hover {
        background: var(--card-hover);
        border-color: var(--accent-blue);
        transform: translateY(-1px);
    }
    .btn-io i { font-size: 0.85rem; color: var(--accent-blue); }

    /* AREA DE SCROLL PERFEITO DENTRO DA BARRA LATERAL */
    .controls-scroll {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    .controls-scroll::-webkit-scrollbar { width: 6px; }
    .controls-scroll::-webkit-scrollbar-track { background: transparent; }
    .controls-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }
    .controls-scroll::-webkit-scrollbar-thumb:hover { background: var(--accent-blue); }

    .control-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .control-group label {
        font-size: 0.68rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    select, input[type="text"] {
        width: 100%;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        color: var(--text-color);
        padding: 9px 12px;
        border-radius: var(--radius-md);
        font-size: 0.82rem;
        font-weight: 600;
        outline: none;
        transition: all 0.2s ease;
    }
    select:focus, input[type="text"]:focus {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* BUTTONS PRIMARY & SECONDARY */
    .btn-primary {
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: #ffffff;
        border: none;
        padding: 12px;
        border-radius: var(--radius-md);
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        margin-top: 4px;
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    .btn-back {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
        padding: 8px 12px;
        border-radius: var(--radius-md);
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
        display: none;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
        width: 100%;
    }
    .btn-back:hover { background: #ef4444; color: #fff; }

    /* MAP CONTAINER */
    #map {
        width: 100%;
        height: 100vh;
        background: var(--bg-color);
        z-index: 1;
    }

    /* MAP CONTROLS OVERLAY */
    .map-controls {
        position: absolute;
        top: 20px;
        right: 365px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .map-btn {
        width: 38px;
        height: 38px;
        background: var(--sidebar-bg);
        backdrop-filter: blur(10px);
        border: 1px solid var(--sidebar-border);
        color: var(--text-color);
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 0.95rem;
        box-shadow: var(--shadow-elevation);
        transition: all 0.2s ease;
    }
    .map-btn:hover {
        background: var(--accent-blue);
        color: #ffffff;
        transform: scale(1.05);
    }

    /* LEGEND OVERLAY */
    .legend {
        position: absolute;
        bottom: 24px;
        right: 365px;
        z-index: 1000;
        background: var(--sidebar-bg);
        backdrop-filter: blur(16px);
        border: 1px solid var(--sidebar-border);
        padding: 10px 14px;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-elevation);
        width: 240px;
    }
    .legend-grid {
        display: flex;
        height: 10px;
        border-radius: 5px;
        overflow: hidden;
        margin-top: 6px;
    }
    .legend-item { flex: 1; height: 100%; }

    /* CANDIDATE ROW & CHECKBOXES IN RESULTS */
    .cand-row {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: all 0.2s ease;
    }
    .cand-row:hover { background: var(--card-hover); }
    .cand-row.disabled { opacity: 0.45; filter: grayscale(80%); }

    .cand-check {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        border: 2px solid var(--card-border);
        background: var(--input-bg);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: all 0.2s ease;
    }
    .cand-check.checked {
        background: var(--accent-blue);
        border-color: var(--accent-blue);
    }
    .cand-check.checked::after {
        content: "\f00c";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        color: #fff;
        font-size: 0.65rem;
    }

    .cand-color {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid rgba(255,255,255,0.4);
        flex-shrink: 0;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .cand-info { flex: 1; }
    .cand-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2px;
        font-size: 0.82rem;
        font-weight: 700;
    }
    .cand-sub {
        display: flex;
        justify-content: space-between;
        font-size: 0.68rem;
        color: var(--text-muted);
        margin-bottom: 4px;
        font-weight: 600;
    }
    .progress-bar {
        height: 6px;
        background: rgba(148, 163, 184, 0.2);
        border-radius: 10px;
        overflow: hidden;
    }
    .progress-fill {
        height: 100%;
        border-radius: 10px;
        transition: width 0.4s ease;
    }

    /* TOOLTIP MAPA */
    .custom-tooltip {
        background: var(--sidebar-bg);
        backdrop-filter: blur(12px);
        border: 1px solid var(--sidebar-border);
        color: var(--text-color);
        padding: 10px 14px;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-elevation);
    }
    .tt-head {
        font-size: 0.82rem;
        font-weight: 800;
        border-bottom: 1px solid var(--card-border);
        padding-bottom: 4px;
        margin-bottom: 6px;
    }
    .tt-body {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.82rem;
    }

    /* LOADER */
    #loader {
        position: fixed; inset: 0;
        background: rgba(11, 15, 25, 0.88);
        backdrop-filter: blur(10px);
        z-index: 1000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
    }
    #loader.hidden { display: none; }
    .spinner {
        width: 48px; height: 48px;
        border: 4px solid rgba(255,255,255,0.1);
        border-left-color: var(--accent-blue);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* MOBILE NAVIGATION */
    .mobile-nav {
        display: none;
        position: fixed; bottom: 0; left: 0; right: 0;
        height: 60px;
        background: var(--sidebar-bg);
        backdrop-filter: blur(20px);
        border-top: 1px solid var(--sidebar-border);
        z-index: 10000;
        grid-template-columns: repeat(3, 1fr);
    }
    .nav-item {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 4px; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); cursor: pointer;
    }
    .nav-item.active { color: var(--accent-blue); }

    @media (max-width: 900px) {
        #app { grid-template-columns: 1fr; }
        .sidebar, .sidebar-right {
            position: absolute; inset: 0; bottom: 60px;
            display: none;
        }
        .sidebar.active, .sidebar-right.active { display: flex; }
        .map-controls, .legend { right: 16px; }
        .mobile-nav { display: grid; }
    }
</style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <h3 id="loaderMsg" style="font-weight: 700;">Carregando Dados Históricos...</h3>
</div>

<div id="app">
    <!-- BARRA LATERAL ESQUERDA (CONTROLES HISTÓRICOS) -->
    <aside class="sidebar" id="sidebarConfig">
        <div class="header">
            <div class="brand-title">
                <h1>Eleições Históricas</h1>
            </div>
            
            <div class="io-buttons">
                <button class="btn-io" onclick="app.resetSelection()"><i class="fas fa-undo"></i> Resetar</button>
                <button class="btn-io" onclick="app.generateStaticMap('png')"><i class="fas fa-image"></i> PNG</button>
                <button class="btn-io" onclick="app.generateStaticMap('svg')"><i class="fas fa-bezier-curve"></i> SVG</button>
                <button class="btn-io" id="themeToggleBtn" onclick="app.toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i> <span id="themeText">Escuro</span></button>
            </div>
        </div>

        <div class="controls-scroll">
            <div class="control-group">
                <label><i class="fas fa-calendar-alt"></i> ANO ELEITORAL</label>
                <select id="yearSelect" onchange="app.checkYearInfo()">
                    <option value="2022">2022</option>
                    <option value="2018">2018</option>
                    <option value="2014">2014</option>
                    <option value="2010">2010</option>
                    <option value="2006">2006</option>
                    <option value="2002">2002</option>
                    <option value="1998">1998</option>
                    <option value="1994">1994</option>
                </select>
            </div>

            <div class="control-group">
                <label><i class="fas fa-flag"></i> TURNO</label>
                <select id="turnSelect">
                    <option value="1">1º Turno</option>
                    <option value="2">2º Turno</option>
                </select>
            </div>

            <div class="control-group">
                <label><i class="fas fa-user-tie"></i> CARGO</label>
                <select id="roleSelect">
                    <option value="president">Presidente</option>
                    <option value="governor">Governador</option>
                    <option value="senator">Senador</option>
                </select>
            </div>

            <div class="control-group">
                <label><i class="fas fa-map-marked-alt"></i> VISUALIZAÇÃO CARTOGRÁFICA</label>
                <select id="viewModeSelect">
                    <option value="states">Por Estados (Brasil)</option>
                    <option value="all_cities">Brasil Municipal</option>
                </select>
            </div>

            <div id="lvNotice" style="font-size: 0.72rem; color: var(--accent-cyan); background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.2); padding: 8px 10px; border-radius: var(--radius-sm); font-weight: 600;">
                <i class="fas fa-info-circle"></i> Em 2022, clique em um município para detalhar os <strong>Locais de Votação (LV)</strong>.
            </div>

            <button class="btn-primary" onclick="app.loadData()"><i class="fas fa-sync-alt"></i> CARREGAR MAPA</button>
        </div>
    </aside>

    <!-- CENTRO: MAPA INTERATIVO LEAFLET COM CANVAS ALTA PRECISÃO -->
    <div id="map"></div>

    <!-- PAINEL DIREITO: RESULTADOS E FILTRO DE CANDIDATOS -->
    <aside class="sidebar-right" id="sidebarResults">
        <div class="header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 id="regionName" style="font-size: 1.2rem; font-weight: 800;">Brasil</h2>
                <span id="regionType" style="font-size: 0.72rem; font-weight: 800; padding: 4px 8px; background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); border-radius: 12px;">Nacional</span>
            </div>
        </div>

        <div style="padding: 14px 18px; border-bottom: 1px solid var(--sidebar-border);">
            <button id="btnBack" class="btn-back" onclick="app.resetSelection()"><i class="fas fa-arrow-left"></i> Voltar Visão Geral</button>
            <div style="font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Total de Votos Computados</div>
            <div id="totalVotesVal" style="font-size: 1.4rem; font-weight: 900; color: var(--text-color); margin-top: 2px;">-</div>
            
            <div style="margin-top: 10px;">
                <input type="text" id="resultsSearchInput" placeholder="🔍 Filtrar candidatos..." oninput="app.filterResultsList(this.value)" style="padding: 6px 10px; font-size: 0.78rem;">
            </div>
        </div>

        <div class="controls-scroll" id="resultsContainer"></div>
    </aside>

    <!-- CONTROLES FLUTUANTES DO MAPA -->
    <div class="map-controls">
        <div class="map-btn" title="Baixar Imagem PNG" onclick="app.generateStaticMap('png')"><i class="fas fa-image"></i></div>
        <div class="map-btn" title="Baixar Vetor SVG" onclick="app.generateStaticMap('svg')"><i class="fas fa-bezier-curve"></i></div>
        <div style="height: 4px;"></div>
        <div class="map-btn" onclick="app.map.zoomIn()"><i class="fas fa-plus"></i></div>
        <div class="map-btn" onclick="app.map.zoomOut()"><i class="fas fa-minus"></i></div>
    </div>

    <!-- LEGENDA FLUTUANTE -->
    <div class="legend">
        <div style="font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--text-muted);">Intensidade (de 5% em 5%)</div>
        <div class="legend-grid" id="legendColors"></div>
        <div style="display:flex; justify-content:space-between; font-size:0.65rem; color:var(--text-muted); margin-top:4px; font-weight: 700;">
            <span>20%</span><span>50%</span><span>100%</span>
        </div>
    </div>

    <!-- NAVEGAÇÃO MOBILE -->
    <div class="mobile-nav">
        <div class="nav-item active" id="navMap" onclick="app.mobileNav('map')"><i class="fas fa-map"></i><span>Mapa</span></div>
        <div class="nav-item" id="navConfig" onclick="app.mobileNav('config')"><i class="fas fa-sliders-h"></i><span>Filtros</span></div>
        <div class="nav-item" id="navResults" onclick="app.mobileNav('results')"><i class="fas fa-chart-bar"></i><span>Resultados</span></div>
    </div>
</div>

<script>
// ============================================================
// CONFIGURAÇÃO REFORMULADA DE DEGRADÊ (PASSO DE 5% EM 5%)
// ============================================================
const GRADIENT_SCHEME = [
    { min: 0,   mix: '#ffffff', ratio: 0.88, ref: '#F5F5F5' },
    { min: 20,  mix: '#ffffff', ratio: 0.82, ref: '#E6E6E6' },
    { min: 25,  mix: '#ffffff', ratio: 0.72, ref: '#D5D5D9' },
    { min: 30,  mix: '#ffffff', ratio: 0.62, ref: '#C4C4C8' },
    { min: 35,  mix: '#ffffff', ratio: 0.52, ref: '#B3B3B7' },
    { min: 40,  mix: '#ffffff', ratio: 0.40, ref: '#A2A2A6' },
    { min: 45,  mix: '#ffffff', ratio: 0.26, ref: '#919195' },
    { min: 50,  mix: '#ffffff', ratio: 0.10, ref: '#808084' },
    { min: 55,  mix: '#000000', ratio: 0.08, ref: '#707074' },
    { min: 60,  mix: '#000000', ratio: 0.20, ref: '#606064' },
    { min: 65,  mix: '#000000', ratio: 0.32, ref: '#505054' },
    { min: 70,  mix: '#000000', ratio: 0.44, ref: '#404044' },
    { min: 75,  mix: '#000000', ratio: 0.56, ref: '#303034' },
    { min: 80,  mix: '#000000', ratio: 0.68, ref: '#222225' },
    { min: 85,  mix: '#000000', ratio: 0.78, ref: '#161618' },
    { min: 90,  mix: '#000000', ratio: 0.86, ref: '#0D0D0E' },
    { min: 95,  mix: '#000000', ratio: 0.92, ref: '#060607' },
    { min: 100, mix: '#000000', ratio: 0.97, ref: '#000000' }
];

const PARTY_COLORS = {
    'PT': '#E12525', 'PL': '#284F8F', 'PSB': '#E12525', 'PDT': '#F58220',
    'UNIÃO': '#0056A8', 'PSDB': '#009EE3', 'MDB': '#008000', 'PSD': '#FAA21B',
    'PP': '#0066CC', 'NOVO': '#F58220', 'REPUBLICANOS': '#0066CC',
    'SOLIDARIEDADE': '#F58220', 'PATRIOTA': '#FFD700', 'PCdoB': '#FF0000',
    'PV': '#00FF00', 'CIDADANIA': '#FFA500', 'AVANTE': '#800080',
    'PRONA': '#006400', 'PFL': '#0056A8', 'PMDB': '#008000', 'PSOL': '#FFCC00',
    'MISSÃO': '#D4AF37', 'OUTROS': '#8b5cf6', 'DEFAULT': '#555555'
};

// DEFINIÇÃO EXATA EPSG:5880 (SIRGAS 2000 / BRAZIL POLYCONIC) PARA LOCAIS DE VOTAÇÃO
proj4.defs("EPSG:5880", "+proj=poly +lat_0=0 +lon_0=-54 +x_0=5000000 +y_0=10000000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");

// ============================================================
// APLICATIVO PRINCIPAL
// ============================================================
const app = {
    map: null,
    layers: { brazil: null, cities: null },
    data: {
        full: null,
        current: null,
        names: {},
        geoJsonCache: null,
        lvCache: {}
    },
    state: {
        view: 'states',
        selectedId: null,
        selectedName: "Brasil",
        ignored: new Set(),
        customColors: JSON.parse(localStorage.getItem('v25_colors') || '{}'),
        level: 'national',
        previousLayer: null,
        lvLayer: null,
        munCodeLV: null,
        currentLVProps: null
    },

    // ---------- INICIALIZAÇÃO ----------
    init: () => {
        app.initTheme();

        // RENDERIZADOR CANVAS LEAFLET COM ALTA ACCURACY E PRECISÃO
        app.map = L.map('map', {
            center: [-15, -50], zoom: 4, zoomControl: false,
            preferCanvas: true,
            renderer: L.canvas({ tolerance: 0, padding: 0.5 })
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            opacity: 0.4
        }).addTo(app.map);

        app.renderLegend();
        app.loadBrazilLayer();
        app.loadData();
    },

    initTheme: () => {
        const savedTheme = localStorage.getItem('eleicoes-view-theme') || 'dark';
        if (savedTheme === 'light') document.body.classList.add('light-theme');
        app.updateThemeUI(savedTheme);
    },
    toggleTheme: () => {
        const isLight = document.body.classList.contains('light-theme');
        if (isLight) {
            document.body.classList.remove('light-theme');
            localStorage.setItem('eleicoes-view-theme', 'dark');
            app.updateThemeUI('dark');
        } else {
            document.body.classList.add('light-theme');
            localStorage.setItem('eleicoes-view-theme', 'light');
            app.updateThemeUI('light');
        }
    },
    updateThemeUI: (theme) => {
        const icon = document.getElementById('themeIcon');
        const text = document.getElementById('themeText');
        if (icon && text) {
            icon.className = theme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
            text.innerText = theme === 'light' ? 'Claro' : 'Escuro';
        }
    },

    mobileNav: (tab) => {
        const left = document.getElementById('sidebarConfig'), right = document.getElementById('sidebarResults'), items = document.querySelectorAll('.nav-item');
        items.forEach(i => i.classList.remove('active'));
        document.getElementById('nav' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
        if(tab === 'map') { left.classList.remove('active'); right.classList.remove('active'); } 
        else if(tab === 'config') { left.classList.add('active'); right.classList.remove('active'); } 
        else if(tab === 'results') { right.classList.add('active'); left.classList.remove('active'); }
    },

    checkYearInfo: () => {
        const yr = document.getElementById('yearSelect').value;
        const notice = document.getElementById('lvNotice');
        if (notice) notice.style.display = (yr === '2022') ? 'block' : 'none';
    },

    // ---------- FUNÇÕES DE COR ----------
    getGradientConfig: (pct) => {
        let config = GRADIENT_SCHEME[0];
        for (let i = 0; i < GRADIENT_SCHEME.length; i++) {
            if (pct >= GRADIENT_SCHEME[i].min) config = GRADIENT_SCHEME[i];
        }
        return config;
    },

    getDiscreteColor: (hex, pct) => {
        const { mix, ratio } = app.getGradientConfig(pct);
        return app.mixColor(hex, mix, ratio);
    },

    mixColor: (hex1, hex2, amount) => {
        const c1 = app.hexToRgb(hex1), c2 = app.hexToRgb(hex2);
        return `rgb(${Math.round(c1.r + (c2.r - c1.r)*amount)}, ${Math.round(c1.g + (c2.g - c1.g)*amount)}, ${Math.round(c1.b + (c2.b - c1.b)*amount)})`;
    },

    hexToRgb: (hex) => {
        let h = hex.substring(1).split('');
        if (h.length === 3) h = [h[0],h[0],h[1],h[1],h[2],h[2]];
        const c = parseInt('0x'+h.join(''));
        return { r: (c>>16)&255, g: (c>>8)&255, b: c&255 };
    },

    renderLegend: () => {
        const legendDiv = document.getElementById('legendColors'); legendDiv.innerHTML = '';
        GRADIENT_SCHEME.forEach(s => {
            if(s.min >= 20) {
                const el = document.createElement('div');
                el.className = 'legend-item';
                el.style.background = s.ref;
                legendDiv.appendChild(el);
            }
        });
    },

    // ---------- CARREGAMENTO DOS DADOS ----------
    loadData: async () => {
        const loader = document.getElementById('loader');
        loader.classList.remove('hidden');
        app.resetAllState();

        const year = document.getElementById('yearSelect').value;
        const role = document.getElementById('roleSelect').value;
        const turn = document.getElementById('turnSelect').value;
        const viewMode = document.getElementById('viewModeSelect').value;

        try {
            const res = await fetch(`data/${year}_${role}.json`);
            if (!res.ok) throw new Error("Dados históricos não encontrados para esta combinação.");
            const json = await res.json();

            if (!json[turn]) {
                alert("Turno indisponível para esta eleição.");
                app.data.current = null;
                return;
            }

            app.data.full = json;
            app.data.current = json[turn];
            app.data.names = json[turn].meta_nomes || {};

            if (viewMode === 'all_cities') {
                await app.loadAllMunicipalities();
            } else {
                app.resetMapToStates();
            }

            app.refreshUI();
        } catch (e) {
            console.error(e);
            alert("Aviso: " + e.message);
        } finally {
            loader.classList.add('hidden');
        }
    },

    resetAllState: () => {
        app.state.ignored.clear();
        app.state.level = 'national';
        app.state.selectedId = null;
        app.state.selectedName = "Brasil";
        app.state.currentLVProps = null;
        if (app.layers.cities) { app.map.removeLayer(app.layers.cities); app.layers.cities = null; }
        if (app.state.lvLayer) { app.map.removeLayer(app.state.lvLayer); app.state.lvLayer = null; }
        document.getElementById('btnBack').style.display = 'none';
    },

    // ---------- CAMADA DE ESTADOS ----------
    loadBrazilLayer: async () => {
        if (app.layers.brazil) {
            app.layers.brazil.addTo(app.map);
            app.layers.brazil.setStyle(f => app.getStyle(f, 'estados'));
            return;
        }
        const res = await fetch('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/brazil-states.geojson');
        const data = await res.json();
        const ufMap = {'AC':'12','AL':'27','AM':'13','AP':'16','BA':'29','CE':'23','DF':'53','ES':'32','GO':'52','MA':'21','MG':'31','MS':'50','MT':'51','PA':'15','PB':'25','PE':'26','PI':'22','PR':'41','RJ':'33','RN':'24','RO':'11','RR':'14','RS':'43','SC':'42','SE':'28','SP':'35','TO':'17'};
        data.features.forEach(f => f.properties.id = ufMap[f.properties.sigla]);

        app.layers.brazil = L.geoJSON(data, {
            smoothFactor: 0,
            style: f => app.getStyle(f, 'estados'),
            onEachFeature: (f, l) => {
                l.on('click', () => {
                    if (app.state.view === 'states') app.loadStateCities(f.properties.id, f.properties.name);
                    else app.selectRegion(f.properties.id, f.properties.name);
                });
                app.bindTooltip(l, f.properties.id, 'estados', f.properties.name);
            }
        }).addTo(app.map);
    },

    resetMapToStates: () => {
        if (app.layers.cities) app.map.removeLayer(app.layers.cities);
        app.loadBrazilLayer();
        app.state.view = 'states';
        app.state.level = 'national';
        app.resetSelection();
    },

    // ---------- CAMADA DE MUNICÍPIOS ----------
    fetchGeoJsonCache: async () => {
        if (app.data.geoJsonCache) return app.data.geoJsonCache;
        const url = "https://raw.githubusercontent.com/tbrugz/geodata-br/master/geojson/geojs-100-mun.json";
        const res = await fetch(url);
        const data = await res.json();
        app.data.geoJsonCache = data;
        return data;
    },

    loadAllMunicipalities: async () => {
        const loader = document.getElementById('loader');
        loader.querySelector('h3').textContent = "Carregando malha municipal...";
        loader.classList.remove('hidden');

        try {
            if (app.layers.cities) app.map.removeLayer(app.layers.cities);
            if (app.layers.brazil) app.map.removeLayer(app.layers.brazil);

            const data = await app.fetchGeoJsonCache();

            app.layers.cities = L.geoJSON(data, {
                smoothFactor: 0,
                style: f => app.getStyle(f, 'municipios'),
                onEachFeature: (f, l) => {
                    const id = String(f.properties.id || f.properties.codarea || f.properties.CD_MUN || '');
                    const name = app.data.names[id] || f.properties.NM_MUN || f.properties.name;
                    l.on('click', (e) => { L.DomEvent.stopPropagation(e); app.selectRegion(id, name); });
                    app.bindTooltip(l, id, 'municipios', name);
                }
            }).addTo(app.map);

            app.state.view = 'all_cities';
            app.state.level = 'municipality';
            app.map.fitBounds(app.layers.cities.getBounds());

        } catch(e) { alert("Erro ao carregar malha municipal."); }
        finally { loader.classList.add('hidden'); app.updateSidebarRight(); }
    },

    loadStateCities: async (ufId, ufName) => {
        const loader = document.getElementById('loader');
        loader.classList.remove('hidden');
        try {
            const fullData = await app.fetchGeoJsonCache();
            const stateFeatures = fullData.features.filter(f => {
                const cod = String(f.properties.id || f.properties.codarea || f.properties.CD_MUN || '');
                return cod && cod.startsWith(ufId);
            });
            const stateGeoJson = { type: "FeatureCollection", features: stateFeatures };

            if (app.layers.cities) app.map.removeLayer(app.layers.cities);
            if (app.layers.brazil) app.map.removeLayer(app.layers.brazil);

            app.layers.cities = L.geoJSON(stateGeoJson, {
                smoothFactor: 0,
                style: f => app.getStyle(f, 'municipios'),
                onEachFeature: (f, l) => {
                    const id = String(f.properties.id || f.properties.codarea || f.properties.CD_MUN || '');
                    const name = app.data.names[id] || f.properties.NM_MUN || f.properties.name;
                    l.on('click', (e) => { L.DomEvent.stopPropagation(e); app.selectRegion(id, name); });
                    app.bindTooltip(l, id, 'municipios', name);
                }
            }).addTo(app.map);

            app.map.fitBounds(app.layers.cities.getBounds());
            app.state.level = 'municipality';
            document.getElementById('btnBack').style.display = 'flex';
            app.refreshUI();

        } catch(e) { console.error(e); }
        finally { loader.classList.add('hidden'); }
    },

    // ---------- LOCAIS DE VOTAÇÃO (COM REPROJEÇÃO REVOLUCIONÁRIA) ----------
    loadLVForMunicipality: async (munCode) => {
        const loader = document.getElementById('loader');
        loader.querySelector('h3').textContent = "Carregando Locais de Votação...";
        loader.classList.remove('hidden');

        try {
            if (!app.data.lvCache[munCode]) {
                const resp = await fetch(`estados_mun/${munCode}.geojson`);
                if (!resp.ok) throw new Error("Arquivo de Locais de Votação não encontrado para o município " + munCode);
                const raw = await resp.json();
                delete raw.crs;
                app.data.lvCache[munCode] = raw;
            }

            const reprojected = app.reprojectGeoJSON(app.data.lvCache[munCode]);
            const features = reprojected.features;

            if (!features || features.length === 0) {
                alert("Nenhum local de votação encontrado para este município.");
                return;
            }

            if (app.layers.cities) {
                app.state.previousLayer = app.layers.cities;
                app.map.removeLayer(app.layers.cities);
                app.layers.cities = null;
            } else if (app.layers.brazil) {
                app.state.previousLayer = app.layers.brazil;
                app.map.removeLayer(app.layers.brazil);
                app.layers.brazil = null;
            }

            const lvLayer = L.geoJSON({ type: "FeatureCollection", features }, {
                smoothFactor: 0,
                style: f => app.getStyle(f, 'locais'),
                onEachFeature: (f, layer) => {
                    const lvId = f.properties.ID_UNICO || f.properties.local_id || f.properties.ZE_NUM;
                    const lvName = f.properties.nm_locvot || f.properties.local_id || `Zona ${f.properties.ZE_NUM}`;
                    layer.on('click', (e) => {
                        L.DomEvent.stopPropagation(e);
                        app.selectRegion(lvId, lvName, f.properties);
                    });
                    app.bindTooltip(layer, lvId, 'locais', lvName, f.properties);
                }
            }).addTo(app.map);

            app.state.lvLayer = lvLayer;
            app.state.level = 'lv';
            app.state.munCodeLV = munCode;

            setTimeout(() => {
                app.map.invalidateSize();
                const bounds = lvLayer.getBounds();
                if (bounds.isValid()) {
                    app.map.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
                }
            }, 100);

        } catch(e) {
            console.error(e);
            alert("Aviso: " + e.message);
        } finally {
            loader.classList.add('hidden');
            app.updateSidebarRight();
        }
    },

    // REPROJEÇÃO DO GEOJSON (EPSG:5880 → WGS84)
    reprojectGeoJSON: (geojson) => {
        const transformCoords = (coords) => {
            if (typeof coords[0] === 'number') {
                if (Math.abs(coords[1]) <= 90 && Math.abs(coords[0]) <= 180) {
                    return coords;
                }
                const [lng, lat] = proj4("EPSG:5880", "EPSG:4326", coords);
                return [lng, lat];
            }
            return coords.map(transformCoords);
        };

        const features = geojson.features.map(f => ({
            ...f,
            geometry: {
                type: f.geometry.type,
                coordinates: transformCoords(f.geometry.coordinates)
            }
        }));

        return { type: "FeatureCollection", features };
    },

    // ---------- SELEÇÃO DE REGIÃO ----------
    selectRegion: (id, name, extraProps) => {
        app.state.selectedId = id;
        app.state.selectedName = name;
        app.state.currentLVProps = extraProps || null;
        document.getElementById('btnBack').style.display = 'flex';

        if (id && String(id).length === 7 && document.getElementById('yearSelect').value === '2022' && app.state.level !== 'lv') {
            app.loadLVForMunicipality(id);
            return;
        }
        app.refreshUI();
    },

    resetSelection: () => {
        const level = app.state.level;

        if (level === 'lv') {
            if (app.state.lvLayer) app.map.removeLayer(app.state.lvLayer);
            if (app.state.previousLayer) {
                if (app.state.previousLayer === app.layers.brazil) app.layers.brazil.addTo(app.map);
                else if (app.state.previousLayer === app.layers.cities) app.layers.cities.addTo(app.map);
                app.state.previousLayer = null;
            }
            app.state.lvLayer = null;
            app.state.level = 'municipality';
            app.state.selectedId = app.state.munCodeLV;
            app.state.selectedName = "Município";
            document.getElementById('btnBack').style.display = 'flex';
            app.refreshUI();
            return;
        }

        if (app.layers.cities) { app.map.removeLayer(app.layers.cities); app.layers.cities = null; }
        if (app.state.view === 'states') {
            app.loadBrazilLayer();
            app.state.selectedId = null;
            app.state.selectedName = "Brasil";
            document.getElementById('btnBack').style.display = 'none';
            app.state.level = 'national';
        } else {
            app.loadAllMunicipalities();
            app.state.selectedId = null;
            app.state.selectedName = "Brasil";
            document.getElementById('btnBack').style.display = 'none';
            app.state.level = 'municipality';
        }
        app.refreshUI();
    },

    refreshUI: () => {
        if (app.layers.brazil) app.layers.brazil.setStyle(f => app.getStyle(f, 'estados'));
        if (app.layers.cities) app.layers.cities.setStyle(f => app.getStyle(f, 'municipios'));
        if (app.state.lvLayer) app.state.lvLayer.setStyle(f => app.getStyle(f, 'locais'));
        app.updateSidebarRight();
    },

    // ---------- PARSER DE VOTOS DE LV ----------
    parseLVVotes: (props) => {
        const turn = document.getElementById('turnSelect').value;
        const suffix = ` ${turn}T`;
        const votes = {};
        Object.entries(props).forEach(([key, val]) => {
            if (typeof val !== 'number' || !key.endsWith(suffix)) return;
            const clean = key.slice(0, -suffix.length).trim();
            const m = clean.match(/^(.+?)\s*\((.+?)\)/);
            if (!m) return;
            const name = m[1], party = m[2];
            const fullKey = `${name} (${party})`;
            votes[fullKey] = (votes[fullKey] || 0) + val;
        });
        return votes;
    },

    recalcStats: (votes) => {
        let total = 0, max = -1, winner = null;
        const rank = [];
        Object.entries(votes).forEach(([c, v]) => {
            if (!app.state.ignored.has(c)) {
                total += v;
                if (v > max) { max = v; winner = c; }
                rank.push({ cand: c, votes: v, pct: 0 });
            } else {
                rank.push({ cand: c, votes: 0, pct: 0, ignored: true, orig: v });
            }
        });
        if (total === 0 && rank.every(r => r.ignored)) return null;
        rank.forEach(r => { if (!r.ignored) r.pct = (r.votes / total) * 100; });
        rank.sort((a,b) => (b.ignored ? -1 : b.votes) - (a.ignored ? -1 : a.votes));
        return { total, winner, pct: winner ? (max/total)*100 : 0, ranking: rank };
    },

    getStyle: (feature, scope) => {
        if (!app.data.current && scope !== 'locais') return { fillColor: '#111', weight: 0.35, color: '#ffffff' };

        let stats;
        if (scope === 'locais') {
            const votes = app.parseLVVotes(feature.properties);
            stats = app.recalcStats(votes);
        } else {
            const id = feature.properties.id || feature.properties.codarea || feature.properties.CD_MUN;
            const raw = app.data.current[scope] ? app.data.current[scope][id] : {};
            stats = app.recalcStats(raw || {});
        }

        if (!stats || !stats.winner) return { fillColor: '#222', weight: 0.35, color: '#ffffff', fillOpacity: 0.9 };

        const party = app.parseCandKey(stats.winner).party;
        const color = app.getDiscreteColor(app.getCandColor(party), stats.pct);
        const weight = scope === 'estados' ? 1.2 : (scope === 'locais' ? 0.25 : 0.35);

        return {
            fillColor: color,
            weight,
            color: '#ffffff',
            opacity: 0.9,
            fillOpacity: 0.95
        };
    },

    bindTooltip: (layer, id, scope, name, extraProps) => {
        layer.bindTooltip(() => {
            let stats;
            if (scope === 'locais' && extraProps) {
                stats = app.recalcStats(app.parseLVVotes(extraProps));
            } else {
                const raw = app.data.current[scope] ? app.data.current[scope][id] : {};
                stats = app.recalcStats(raw || {});
            }
            if (!stats) return `<div class="custom-tooltip"><div class="tt-head">${name}</div>Sem dados</div>`;
            const { name: wName, party } = app.parseCandKey(stats.winner);
            const color = app.getCandColor(party);
            return `<div class="custom-tooltip">
                <div class="tt-head">${name}</div>
                <div class="tt-body">
                    <div style="color:${color}; font-weight:800;">${wName} (${party})</div>
                    <div style="font-weight:900;">${stats.pct.toFixed(2)}% (${stats.ranking[0].votes.toLocaleString('pt-BR')} votos)</div>
                </div>
            </div>`;
        }, { sticky: true, direction: 'top' });
    },

    parseCandKey: (k) => {
        const m = k.match(/(.*?)\s*\((.*?)\)/);
        return m ? { name: m[1], party: m[2] } : { name: k, party: 'DEFAULT' };
    },

    getCandColor: (p) => app.state.customColors[p] || PARTY_COLORS[p] || PARTY_COLORS['DEFAULT'],

    // ---------- PAINEL LATERAL DIREITO ----------
    updateSidebarRight: () => {
        const container = document.getElementById('resultsContainer');
        const titleEl = document.getElementById('regionName');
        const totalEl = document.getElementById('totalVotesVal');
        const typeEl = document.getElementById('regionType');
        container.innerHTML = '';
        titleEl.textContent = app.state.selectedName;

        let rawVotes = {};
        if (app.state.level === 'lv' && app.state.currentLVProps) {
            rawVotes = app.parseLVVotes(app.state.currentLVProps);
            typeEl.textContent = 'Local de Votação';
        } else if (!app.state.selectedId) {
            if (app.data.current) {
                Object.values(app.data.current.estados).forEach(st => {
                    Object.entries(st).forEach(([c, v]) => rawVotes[c] = (rawVotes[c] || 0) + v);
                });
            }
            typeEl.textContent = 'Nacional';
        } else {
            const scope = (String(app.state.selectedId).length === 2) ? 'estados' : 'municipios';
            rawVotes = app.data.current[scope] ? app.data.current[scope][app.state.selectedId] || {} : {};
            typeEl.textContent = (scope === 'estados') ? 'Estado' : 'Município';
        }

        const allCands = new Set([...Object.keys(rawVotes), ...app.state.ignored]);
        const cleanVotes = {};
        allCands.forEach(c => cleanVotes[c] = rawVotes[c] || 0);
        const stats = app.recalcStats(cleanVotes);
        if (!stats) { totalEl.textContent = "0"; container.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem;">Sem dados computados</div>'; return; }

        totalEl.textContent = stats.total.toLocaleString('pt-BR');
        stats.ranking.forEach(r => {
            const { name, party } = app.parseCandKey(r.cand);
            const color = app.getCandColor(party);
            const isIgnored = r.ignored;

            const div = document.createElement('div');
            div.className = `cand-row ${isIgnored ? 'disabled' : ''}`;
            div.innerHTML = `
                <div class="cand-check ${isIgnored ? '' : 'checked'}"></div>
                <div class="cand-color" style="background:${color}" title="Clique para alterar a cor do partido (${party})"></div>
                <div class="cand-info">
                    <div class="cand-head">
                        <span>${name}</span>
                        <span style="color:${color}; font-weight:900;">${isIgnored ? '--' : r.pct.toFixed(2)+'%'}</span>
                    </div>
                    <div class="cand-sub">
                        <span>${party}</span>
                        <span>${isIgnored ? (r.orig||0).toLocaleString('pt-BR') : r.votes.toLocaleString('pt-BR')} votos</span>
                    </div>
                    ${!isIgnored ? `<div class="progress-bar"><div class="progress-fill" style="width:${r.pct}%;background:${color}"></div></div>` : ''}
                </div>`;

            div.querySelector('.cand-check').onclick = () => {
                if (app.state.ignored.has(r.cand)) app.state.ignored.delete(r.cand);
                else app.state.ignored.add(r.cand);
                app.refreshUI();
            };
            div.querySelector('.cand-color').onclick = (e) => {
                e.stopPropagation();
                app.openColorPicker(party, color, e.target);
            };
            container.appendChild(div);
        });
    },

    filterResultsList: (term) => {
        const rows = document.querySelectorAll('#resultsContainer .cand-row');
        term = term.toLowerCase();
        rows.forEach(r => {
            const text = r.innerText.toLowerCase();
            r.style.display = text.includes(term) ? 'flex' : 'none';
        });
    },

    openColorPicker: (party, def, el) => {
        const pickr = Pickr.create({
            el, theme: 'nano', default: def,
            swatches: Object.values(PARTY_COLORS).slice(0,10),
            components: { preview: true, hue: true, interaction: { save: true } }
        });
        pickr.on('save', (c) => {
            app.state.customColors[party] = c.toHEXA().toString();
            localStorage.setItem('v25_colors', JSON.stringify(app.state.customColors));
            el.style.background = c.toHEXA().toString();
            app.refreshUI();
            pickr.destroyAndRemove();
        });
    },

    // ---------- EXPORTAÇÃO PNG/SVG ----------
    generateStaticMap: async (format) => {
        const loader = document.getElementById('loader');
        loader.classList.remove('hidden');
        setTimeout(() => {
            try {
                let features = [];
                let scope = 'municipios';

                if (app.state.level === 'lv' && app.state.lvLayer) {
                    features = app.state.lvLayer.toGeoJSON().features;
                    scope = 'locais';
                } else if (app.state.view === 'states' && !app.state.selectedId) {
                    if (app.layers.brazil) {
                        features = app.layers.brazil.toGeoJSON().features;
                        scope = 'estados';
                    } else throw new Error("Mapa nacional não carregado.");
                } else if (app.state.selectedId && String(app.state.selectedId).length === 2) {
                    if (!app.data.geoJsonCache) throw new Error("Dados municipais não carregados.");
                    features = app.data.geoJsonCache.features.filter(f => {
                        const id = String(f.properties.id || f.properties.codarea || f.properties.CD_MUN || '');
                        return id && id.startsWith(app.state.selectedId);
                    });
                    scope = 'municipios';
                } else if (app.state.view === 'all_cities') {
                    if (!app.data.geoJsonCache) throw new Error("Dados municipais não carregados.");
                    features = app.data.geoJsonCache.features;
                } else if (app.layers.brazil) {
                    features = app.layers.brazil.toGeoJSON().features;
                    scope = 'estados';
                }

                if (features.length === 0) throw new Error("Nenhum dado para exportar.");

                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                features.forEach(f => {
                    const scan = (coords) => {
                        coords.forEach(pt => {
                            if (typeof pt[0] === 'number') {
                                if (pt[0] < minX) minX = pt[0];
                                if (pt[0] > maxX) maxX = pt[0];
                                if (pt[1] < minY) minY = pt[1];
                                if (pt[1] > maxY) maxY = pt[1];
                            } else scan(pt);
                        });
                    };
                    if (f.geometry && f.geometry.type.includes('Polygon')) scan(f.geometry.coordinates);
                });

                const w = 3840;
                const latD = maxY - minY;
                const lonD = maxX - minX;
                const h = w / (lonD / latD);
                const proj = (x, y) => [(x - minX) * (w / lonD), (maxY - y) * (h / latD)];

                let svgContent = '';
                features.forEach(f => {
                    let color = '#222';
                    if (scope === 'locais') {
                        const votes = app.parseLVVotes(f.properties);
                        const stats = app.recalcStats(votes);
                        if (stats && stats.winner) {
                            const party = app.parseCandKey(stats.winner).party;
                            color = app.getDiscreteColor(app.getCandColor(party), stats.pct);
                        }
                    } else if (app.data.current) {
                        const id = String(f.properties.id || f.properties.codarea || f.properties.CD_MUN || '');
                        const raw = app.data.current[scope] ? app.data.current[scope][id] : {};
                        const stats = app.recalcStats(raw || {});
                        if (stats && stats.winner) {
                            const party = app.parseCandKey(stats.winner).party;
                            color = app.getDiscreteColor(app.getCandColor(party), stats.pct);
                        }
                    }

                    let d = '';
                    const draw = (r) => {
                        let p = '';
                        r.forEach((pt, i) => {
                            const [px, py] = proj(pt[0], pt[1]);
                            p += (i === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1);
                        });
                        return p + 'Z ';
                    };
                    if (f.geometry.type === 'Polygon') f.geometry.coordinates.forEach(r => d += draw(r));
                    else if (f.geometry.type === 'MultiPolygon') f.geometry.coordinates.forEach(p => p.forEach(r => d += draw(r)));

                    const strW = scope === 'estados' ? 2 : 0.5;
                    svgContent += `<path d="${d}" fill="${color}" stroke="#fff" stroke-width="${strW}"/>`;
                });

                const finalSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}">${svgContent}</svg>`;
                const fname = `mapa_historico_${app.state.selectedName}_${scope}_${document.getElementById('yearSelect').value}`;

                if (format === 'svg') {
                    const blob = new Blob([finalSvg], {type: "image/svg+xml;charset=utf-8"});
                    saveAs(blob, `${fname}.svg`);
                } else {
                    const img = new Image();
                    img.onload = () => {
                        const c = document.createElement('canvas');
                        c.width = w;
                        c.height = h;
                        const ctx = c.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        c.toBlob(b => saveAs(b, `${fname}.png`));
                    };
                    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(finalSvg)));
                }

            } catch(e) {
                alert("Erro ao gerar mapa: " + e.message);
                console.error(e);
            } finally {
                loader.classList.add('hidden');
            }
        }, 100);
    }
};

document.addEventListener('DOMContentLoaded', app.init);
</script>
